name: Build Midgard GIF

on:
  push:
    paths:
      - 'build_midgard.py'
      - '.github/workflows/build-midgard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: pip install pillow numpy

      - name: Render luminous Midgard GIF
        run: python build_midgard.py

      - name: Commit rendered GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add midgard_bottom.gif
          git diff --cached --quiet || git commit -m "Render luminous painterly Midgard village GIF"
          git push
