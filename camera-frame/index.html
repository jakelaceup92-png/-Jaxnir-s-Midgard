<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jaxnir Electric Camera Frame</title>
  <style>
    :root {
      --blue: #159cff;
      --blue-deep: #086dbd;
      --ice: #c9f2ff;
      --white: #f5fdff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .camera-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      isolation: isolate;
    }

    .frame-svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .frame-svg rect,
    .frame-svg path {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .shadow-rail {
      stroke: rgba(0, 5, 12, 0.96);
      stroke-width: 8;
    }

    .outer-rail {
      stroke: rgba(20, 141, 222, 0.88);
      stroke-width: 3;
      filter: url(#softGlow);
      animation: rail-breathe 4.8s ease-in-out infinite;
    }

    .inner-rail {
      stroke: rgba(174, 231, 255, 0.72);
      stroke-width: 1.4;
      filter: url(#softGlow);
    }

    .energy-track {
      stroke: rgba(52, 174, 255, 0.3);
      stroke-width: 1;
    }

    .charge {
      stroke: var(--ice);
      stroke-width: 3.2;
      stroke-linecap: round;
      filter: url(#hardGlow);
      will-change: stroke-dashoffset, opacity;
    }

    .charge-primary {
      stroke-dasharray: 10 90;
      animation: charge-run 5.8s linear infinite;
    }

    .charge-secondary {
      stroke: #54c5ff;
      stroke-width: 2;
      stroke-dasharray: 4 46 2 48;
      animation: charge-run 8.6s linear infinite reverse;
      opacity: 0.72;
    }

    .charge-spark {
      stroke: var(--white);
      stroke-width: 4.2;
      stroke-dasharray: 0.8 99.2;
      animation: charge-run 4.4s linear infinite;
      filter: url(#hardGlow);
    }

    .corner-bracket {
      stroke: rgba(114, 213, 255, 0.96);
      stroke-width: 4;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: url(#hardGlow);
      animation: corner-pulse 3.6s ease-in-out infinite;
    }

    .corner-bracket.faint {
      stroke: rgba(15, 105, 177, 0.78);
      stroke-width: 7;
      filter: none;
    }

    .electric-arc {
      stroke: var(--white);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      filter: url(#arcGlow);
      will-change: opacity;
    }

    .arc-top {
      animation: arc-top 5.2s steps(1, end) infinite;
    }

    .arc-right {
      animation: arc-right 6.1s steps(1, end) infinite;
    }

    .arc-bottom {
      animation: arc-bottom 5.7s steps(1, end) infinite;
    }

    .arc-left {
      animation: arc-left 6.5s steps(1, end) infinite;
    }

    @keyframes charge-run {
      from {
        stroke-dashoffset: 0;
      }
      to {
        stroke-dashoffset: -100;
      }
    }

    @keyframes rail-breathe {
      0%, 100% {
        stroke: rgba(20, 141, 222, 0.74);
        opacity: 0.82;
      }
      50% {
        stroke: rgba(72, 194, 255, 1);
        opacity: 1;
      }
    }

    @keyframes corner-pulse {
      0%, 100% {
        opacity: 0.68;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes arc-top {
      0%, 9%, 15%, 62%, 68%, 100% { opacity: 0; }
      10%, 12%, 63%, 66% { opacity: 1; }
      11%, 13%, 64% { opacity: 0.28; }
    }

    @keyframes arc-right {
      0%, 24%, 30%, 77%, 83%, 100% { opacity: 0; }
      25%, 28%, 78%, 81% { opacity: 1; }
      26%, 29%, 79% { opacity: 0.22; }
    }

    @keyframes arc-bottom {
      0%, 39%, 45%, 88%, 94%, 100% { opacity: 0; }
      40%, 43%, 89%, 92% { opacity: 1; }
      41%, 44%, 90% { opacity: 0.24; }
    }

    @keyframes arc-left {
      0%, 53%, 59%, 100% { opacity: 0; }
      54%, 57% { opacity: 1; }
      55%, 58% { opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .outer-rail,
      .charge,
      .corner-bracket,
      .electric-arc {
        animation: none !important;
      }

      .electric-arc {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <main class="camera-frame" aria-label="Jaxnir animated electric camera frame">
    <svg class="frame-svg" viewBox="0 0 1000 562" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur stdDeviation="2.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="hardGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="4.5" result="wide"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="tight"/>
          <feMerge>
            <feMergeNode in="wide"/>
            <feMergeNode in="tight"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="arcGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="wide"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="tight"/>
          <feMerge>
            <feMergeNode in="wide"/>
            <feMergeNode in="tight"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect class="shadow-rail" x="9" y="9" width="982" height="544"/>
      <rect class="outer-rail" x="9" y="9" width="982" height="544"/>
      <rect class="inner-rail" x="18" y="18" width="964" height="526"/>
      <rect class="energy-track" x="13" y="13" width="974" height="536" pathLength="100"/>

      <rect class="charge charge-primary" x="13" y="13" width="974" height="536" pathLength="100"/>
      <rect class="charge charge-secondary" x="16" y="16" width="968" height="530" pathLength="100"/>
      <rect class="charge charge-spark" x="11" y="11" width="978" height="540" pathLength="100"/>

      <g class="corner-bracket faint">
        <path d="M9 118V9h132"/>
        <path d="M859 9h132v109"/>
        <path d="M991 444v109H859"/>
        <path d="M141 553H9V444"/>
      </g>

      <g class="corner-bracket">
        <path d="M9 91V9h102"/>
        <path d="M889 9h102v82"/>
        <path d="M991 471v82H889"/>
        <path d="M111 553H9v-82"/>
      </g>

      <path class="electric-arc arc-top" d="M126 11h38l9-6 8 13 11-9 8 5 12-4h52"/>
      <path class="electric-arc arc-right" d="M989 125v42l-6 9 13 8-10 11 6 9-4 13v47"/>
      <path class="electric-arc arc-bottom" d="M874 551h-42l-9 6-8-13-11 9-8-5-12 4h-50"/>
      <path class="electric-arc arc-left" d="M11 437v-41l6-9-13-8 10-11-6-9 4-13v-48"/>
    </svg>
  </main>
</body>
</html>
