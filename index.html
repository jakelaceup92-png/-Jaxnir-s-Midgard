<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,D=1,last=performance.now();
const IMG={};function load(k,u){const i=new Image();i.src=u;IMG[k]=i}
load('wolf','https://opengameart.org/sites/default/files/wolf%20walk.png');
load('stag','https://opengameart.org/sites/default/files/deer%20male%20calciumtrice.png');
function svgImage(k,s){load(k,'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s))}
svgImage('bear',`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" shape-rendering="crispEdges"><g stroke="#17100e" stroke-width="3" stroke-linejoin="miter"><path fill="#40281f" d="M13 45 17 31 27 22 47 18 70 20 88 27 98 34 106 35 112 41 110 49 102 53 92 53 87 61 82 70 70 70 67 54 48 55 43 70 31 70 29 55 20 57 13 52Z"/><path fill="#684434" d="M20 43 23 31 34 24 51 22 69 24 84 30 91 38 88 48 74 50 56 47 40 50 26 52 18 48Z"/><path fill="#8a5c43" d="M32 28 47 23 65 25 77 29 68 35 49 34 35 38 24 41 25 33Z"/><path fill="#9d7155" d="M80 29 92 29 101 34 108 36 112 42 109 48 100 49 93 45 88 38Z"/><path fill="#c29a76" d="M96 40 109 40 112 44 108 48 98 48 92 44Z"/><path fill="#241714" d="M106 39 113 41 112 46 107 47 104 44Z"/><rect fill="#e0b457" x="94" y="35" width="3" height="3"/><path fill="#2a1a17" d="M24 52 36 52 36 67 31 72 24 70 26 59ZM65 51 78 52 78 67 73 72 66 70 68 59Z"/><path fill="#6c4635" d="M28 54 34 54 33 67 29 69ZM69 53 75 54 74 67 70 69Z"/><path fill="#2d1c18" d="M22 27 24 20 30 18 35 22 32 28ZM78 27 80 21 86 20 91 25 88 31Z"/></g></svg>`);
svgImage('ram',`<svg xmlns="http://www.w3.org/2000/svg" width="112" height="82" viewBox="0 0 112 82" shape-rendering="crispEdges"><g stroke="#17131b" stroke-width="3" stroke-linejoin="miter"><path fill="#d8d0c8" d="M20 43 24 29 36 24 53 26 65 30 79 33 91 40 94 51 88 58 75 58 68 54 55 55 49 68 39 68 37 55 27 57 20 52Z"/><path fill="#eee6dd" d="M27 39 31 29 43 27 56 29 66 34 74 39 69 48 55 48 43 44 31 49 24 47Z"/><path fill="#b4a7b6" d="M45 55 53 55 51 70 43 70ZM75 55 84 55 83 70 75 70Z"/><path fill="#292030" d="M42 69 52 69 51 74 42 74ZM74 69 84 69 84 74 74 74Z"/><path fill="#e7ddd5" d="M78 35 93 34 103 40 105 47 100 53 89 52 83 47Z"/><rect fill="#251a25" x="94" y="41" width="3" height="3"/><rect fill="#806d91" x="89" y="38" width="3" height="3"/><path fill="none" stroke="#5c3f69" stroke-width="8" d="M88 38C105 34 108 16 94 9 78 1 66 13 69 27 71 37 81 39 89 33 96 28 94 19 87 18 79 17 76 25 81 30"/><path fill="none" stroke="#a879ae" stroke-width="3" d="M88 36C101 31 101 18 92 14 82 9 74 16 74 26 75 33 82 35 88 31"/><path fill="#e7ddd5" d="M18 45 12 41 8 45 13 49Z"/></g></svg>`);
svgImage('raven',`<svg xmlns="http://www.w3.org/2000/svg" width="104" height="72" viewBox="0 0 104 72" shape-rendering="crispEdges"><g stroke="#0b0d17" stroke-width="3" stroke-linejoin="miter"><path fill="#161d2b" d="M17 42 24 27 38 20 55 22 65 28 77 30 88 35 96 36 100 40 94 44 82 44 74 48 66 58 52 60 39 55 27 52Z"/><path fill="#25334a" d="M27 38 35 26 48 24 60 27 69 34 62 43 49 47 35 45Z"/><path fill="#4c4777" d="M34 32 45 27 56 29 62 34 54 36 47 34 40 38Z"/><path fill="#655895" d="M39 40 48 35 58 37 64 41 55 44 45 44Z"/><path fill="#1c273a" d="M62 29 76 25 88 28 96 34 94 39 82 40 72 37Z"/><path fill="#2d4960" d="M78 29 91 31 98 35 94 38 80 36Z"/><path fill="#9dceec" d="M88 31 96 34 92 36 86 34Z"/><rect fill="#9ed7ff" x="75" y="29" width="4" height="4"/><rect fill="#0b0d17" x="76" y="30" width="2" height="2"/><path fill="#111723" d="M24 44 10 51 29 50ZM35 50 18 60 42 55ZM50 54 37 66 57 58Z"/><path fill="#222c42" d="M59 44 71 48 64 55 54 55Z"/><path fill="none" stroke="#36475e" stroke-width="3" d="M57 58 56 68M67 55 70 67M53 68 61 68M67 67 76 68"/></g></svg>`);
const actors=[],leaves=[],stones=[],tufts=[];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;if(!stones.length){for(let i=0;i<44;i++)stones.push({x:Math.random()*W,y:Math.random(),w:3+Math.random()*9,h:2+Math.random()*4});for(let i=0;i<36;i++)tufts.push({x:Math.random()*W,y:Math.random(),s:.7+Math.random()*.7,p:Math.random()*20})}}
addEventListener('resize',resize);resize();
function add(kind,x,lane,dir,speed,scale=1){actors.push({kind,x,lane,dir,speed,scale,phase:Math.random()*30})}
add('wolf',W*.05,0,1,17,1);add('stag',W*.25,1,1,12,1.02);add('bear',W*.44,2,-1,8,1);add('ram',W*.69,1,-1,11,1);add('wolf',W*.88,0,-1,15,.98);add('raven',W*.18,0,1,25,.82);add('raven',W*.80,0,-1,22,.76);
for(let i=0;i<28;i++)leaves.push({x:Math.random()*W,v:10+Math.random()*20,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.5?'#9a6234':'#6f492e'});
function grassPatch(x,y,t,s,p){ctx.lineWidth=1;for(let i=-8;i<=8;i+=4){const sw=Math.sin(t*.001+p+i*.2)*2.8*s;ctx.strokeStyle=i%8===0?'rgba(127,153,101,.82)':'rgba(73,111,72,.8)';ctx.beginPath();ctx.moveTo(x+i*s,y);ctx.lineTo(x+i*s+sw,y-(7+Math.abs(i%7))*s);ctx.stroke()}}
function ground(t){const top=H-62,g=ctx.createLinearGradient(0,top-60,0,H);g.addColorStop(0,'rgba(3,10,17,0)');g.addColorStop(.55,'rgba(5,15,20,.08)');g.addColorStop(1,'rgba(2,7,9,.62)');ctx.fillStyle=g;ctx.fillRect(0,top-60,W,122);ctx.fillStyle='rgba(18,35,37,.3)';ctx.beginPath();ctx.moveTo(0,top+5);for(let x=0;x<=W;x+=55)ctx.lineTo(x,top-10-Math.sin(x*.013+1.3)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(41,65,47,.95)';ctx.beginPath();ctx.moveTo(0,top+4);for(let x=0;x<=W;x+=14)ctx.lineTo(x,top+Math.sin(x*.03)*2);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(57,50,38,.90)';ctx.fillRect(0,H-43,W,43);ctx.fillStyle='rgba(69,59,43,.8)';ctx.fillRect(0,H-38,W,5);for(const s of stones){const y=H-39+s.y*27;ctx.fillStyle='rgba(82,81,73,.76)';ctx.fillRect(s.x,y-s.h,s.w,s.h);ctx.fillStyle='rgba(135,132,115,.36)';ctx.fillRect(s.x+1,y-s.h,s.w*.55,1)}for(const u of tufts)grassPatch(u.x,H-39+u.y*19,t,u.s,u.p);for(let x=2;x<W;x+=7){const sw=Math.sin(t*.001+x*.052)*2.6;ctx.strokeStyle=x%28===0?'rgba(139,164,110,.85)':'rgba(77,117,77,.76)';ctx.beginPath();ctx.moveTo(x,top+3);ctx.lineTo(x+sw,top-5-(x%6));ctx.stroke()}}
function fire(t){const fx=W*.51,base=H-42;ctx.save();ctx.fillStyle='rgba(39,29,24,.92)';ctx.beginPath();ctx.ellipse(fx,base+17,43,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3022';ctx.save();ctx.translate(fx,base+10);ctx.rotate(.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.save();ctx.translate(fx,base+10);ctx.rotate(-.15);ctx.fillRect(-34,-4,68,8);ctx.restore();const f1=Math.sin(t*.027)*9,f2=Math.sin(t*.041+1.2)*7,f3=Math.sin(t*.019+2.4)*8;ctx.shadowColor='rgba(255,112,28,.98)';ctx.shadowBlur=31;ctx.fillStyle='rgba(224,65,18,.98)';ctx.beginPath();ctx.moveTo(fx-21,base+7);ctx.quadraticCurveTo(fx-16,base-25-f1,fx-6,base-42-f2);ctx.quadraticCurveTo(fx,base-17,fx+6,base-51-f3);ctx.quadraticCurveTo(fx+17,base-23,fx+22,base+7);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,139,28,.99)';ctx.beginPath();ctx.moveTo(fx-13,base+6);ctx.quadraticCurveTo(fx-6,base-26-f2*.7,fx+1,base-35-f1*.5);ctx.quadraticCurveTo(fx+7,base-12,fx+14,base+6);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,232,126,1)';ctx.beginPath();ctx.moveTo(fx-5,base+5);ctx.quadraticCurveTo(fx,base-15-f3*.4,fx+4,base-23);ctx.quadraticCurveTo(fx+8,base-8,fx+8,base+5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(let i=0;i<13;i++){const ey=base-12-((t*.04+i*11)%50),ex=fx+Math.sin(t*.004+i*1.7)*21;ctx.globalAlpha=.3+((i%4)*.13);ctx.fillStyle=i%2?'#ffc052':'#ff6b24';ctx.fillRect(ex,ey,2+(i%2),2+(i%2))}ctx.restore();ctx.globalAlpha=1}
function moveLeaves(t,dt){const top=H-61;for(const l of leaves){l.x+=l.v*dt;const y=top+8+Math.sin(t*.0017+l.p)*11+Math.abs(Math.sin(t*.0008+l.p))*18;if(l.x>W+15){l.x=-15;l.p=Math.random()*20}ctx.save();ctx.translate(l.x,y);ctx.rotate(Math.sin(t*.0025+l.p)*1.1);ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.restore()}}
function shadow(x,y,w,a=.34){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(x,y,w,5,0,0,Math.PI*2);ctx.fill()}
function gy(a){return H-54+a.lane*8}
function drawWolf(a,t){const im=IMG.wolf;if(!im.complete||!im.naturalWidth)return;const sw=im.naturalWidth/2,sh=im.naturalHeight/3,fr=((t/150+a.phase*8)|0)%6,sx=(fr%2)*sw,sy=Math.floor(fr/2)*sh,sc=1.72*a.scale,y=gy(a),dw=sw*sc,dh=sh*sc;shadow(a.x,y,dw*.28);ctx.save();ctx.translate(a.x,y+1);if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,sx,sy,sw,sh,-dw/2,-dh+13,dw,dh);ctx.restore()}
function drawStag(a,t){const im=IMG.stag;if(!im.complete||!im.naturalWidth)return;const sw=32,sh=32,fr=((t/170+a.phase)|0)%5,sx=fr*sw,sy=64,sc=3.15*a.scale,y=gy(a),dw=sw*sc,dh=sh*sc;shadow(a.x,y,dw*.31);ctx.save();ctx.translate(a.x,y+1);if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,sx,sy,sw,sh,-dw/2,-dh+8,dw,dh);ctx.fillStyle='#1b1210';ctx.fillRect(dw*.27,-dh*.66,4,4);ctx.fillStyle='#d9b785';ctx.fillRect(dw*.31,-dh*.57,11,4);ctx.fillStyle='#5a3b29';ctx.fillRect(dw*.36,-dh*.54,7,3);ctx.restore()}
function drawStatic(a,key,w,h,sc,yoff=8){const im=IMG[key];if(!im.complete||!im.naturalWidth)return;const y=gy(a),dw=w*sc*a.scale,dh=h*sc*a.scale;shadow(a.x,y,dw*.28);ctx.save();ctx.translate(a.x,y+1+Math.sin(performance.now()*.003+a.phase)*1.2);if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,-dw/2,-dh+yoff,dw,dh);ctx.restore()}
function flightY(a,t){const top=Math.max(78,H*.23),bottom=Math.max(top+34,H*.43);return Math.max(top,Math.min(bottom,(top+bottom)/2+Math.sin(t*.0012+a.phase)*13))}
function drawRaven(a,t){const im=IMG.raven;if(!im.complete||!im.naturalWidth)return;const flap=1+Math.sin(t*.012+a.phase)*.04,dw=104*1.05*a.scale,dh=72*1.05*a.scale*flap,y=flightY(a,t);ctx.save();ctx.translate(a.x,y);if(a.dir<0)ctx.scale(-1,1);ctx.rotate(Math.sin(t*.004+a.phase)*.04);ctx.drawImage(im,-dw/2,-dh/2,dw,dh);ctx.restore()}
function draw(a,t){if(a.kind==='wolf')drawWolf(a,t);else if(a.kind==='stag')drawStag(a,t);else if(a.kind==='bear')drawStatic(a,'bear',120,80,.88,9);else if(a.kind==='ram')drawStatic(a,'ram',112,82,.88,9);else drawRaven(a,t)}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);for(const a of actors){a.x+=a.dir*a.speed*dt;if(a.x<-130)a.dir=1;if(a.x>W+130)a.dir=-1;if(Math.random()<.0007)a.dir*=-1;draw(a,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
