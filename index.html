<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,D=1,last=performance.now();
const wolf=new Image(),forest=new Image();wolf.src='https://opengameart.org/sites/default/files/wolf%20walk.png';forest.src='https://opengameart.org/sites/default/files/enemies_081719_zp.png';
const actors=[];const leaves=[];const stones=[];function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;if(!stones.length){for(let i=0;i<32;i++)stones.push({x:Math.random()*W,w:3+Math.random()*8,h:2+Math.random()*4})}}addEventListener('resize',resize);resize();
const kinds=['wolf','wolf','dire','frost','bear','boar','wolf','dire'];for(let i=0;i<8;i++)actors.push({kind:kinds[i],x:Math.random()*W,dir:Math.random()<.5?-1:1,speed:12+Math.random()*15,phase:Math.random()*20,rare:Math.random()<.06});for(let i=0;i<20;i++)leaves.push({x:Math.random()*W,y:0,v:11+Math.random()*20,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.55?'#9a6234':'#6f492e'});
function grass(t,gy){ctx.lineWidth=1;for(let x=3;x<W;x+=6){const sway=Math.sin(t*.00105+x*.055)*2.4;const tall=5+(x%5);ctx.strokeStyle=x%18===0?'rgba(122,151,104,.78)':'rgba(75,112,77,.7)';ctx.beginPath();ctx.moveTo(x,gy+2);ctx.lineTo(x+sway,gy-tall);ctx.stroke();if(x%24===0){ctx.strokeStyle='rgba(143,160,110,.45)';ctx.beginPath();ctx.moveTo(x+2,gy);ctx.lineTo(x+4+sway*.7,gy-5);ctx.stroke()}}}
function ground(t){const gy=H-39;let g=ctx.createLinearGradient(0,gy-76,0,H);g.addColorStop(0,'rgba(3,10,17,0)');g.addColorStop(.55,'rgba(5,15,20,.07)');g.addColorStop(1,'rgba(2,8,11,.48)');ctx.fillStyle=g;ctx.fillRect(0,gy-76,W,115);ctx.fillStyle='rgba(22,39,40,.30)';ctx.beginPath();ctx.moveTo(0,gy);for(let x=0;x<=W;x+=70)ctx.lineTo(x,gy-11-Math.sin(x*.011+1.4)*4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(43,66,49,.92)';ctx.beginPath();ctx.moveTo(0,gy);for(let x=0;x<=W;x+=20)ctx.lineTo(x,gy+Math.sin(x*.032)*1.7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(55,48,39,.82)';ctx.fillRect(0,H-20,W,20);ctx.fillStyle='rgba(77,67,52,.72)';ctx.fillRect(0,H-15,W,4);for(const s of stones){const y=H-18;ctx.fillStyle='rgba(88,84,75,.72)';ctx.fillRect(s.x,y-s.h,s.w,s.h);ctx.fillStyle='rgba(123,119,105,.35)';ctx.fillRect(s.x+1,y-s.h,s.w*.55,1)}grass(t,gy)}
function fire(t){const fx=W*.51,base=H-26;ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(48,34,26,.95)';ctx.fillRect(fx-27,base+9,54,6);ctx.fillStyle='rgba(84,50,31,.95)';ctx.fillRect(fx-21,base+4,42,7);const f1=Math.sin(t*.027)*7,f2=Math.sin(t*.041+1.2)*5,f3=Math.sin(t*.019+2.4)*6;ctx.shadowColor='rgba(255,116,35,.95)';ctx.shadowBlur=24;ctx.fillStyle='rgba(235,77,22,.98)';ctx.beginPath();ctx.moveTo(fx-17,base+5);ctx.quadraticCurveTo(fx-13,base-19-f1,fx-4,base-31-f2);ctx.quadraticCurveTo(fx,base-12,fx+5,base-38-f3);ctx.quadraticCurveTo(fx+13,base-18,fx+18,base+5);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,146,35,.98)';ctx.beginPath();ctx.moveTo(fx-10,base+4);ctx.quadraticCurveTo(fx-4,base-19-f2*.7,fx+1,base-26-f1*.45);ctx.quadraticCurveTo(fx+5,base-9,fx+11,base+4);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,230,124,1)';ctx.beginPath();ctx.moveTo(fx-4,base+3);ctx.quadraticCurveTo(fx,base-11-f3*.35,fx+3,base-17);ctx.quadraticCurveTo(fx+6,base-7,fx+7,base+3);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(let i=0;i<8;i++){const ey=base-10-((t*.034+i*13)%34),ex=fx+Math.sin(t*.004+i*1.9)*15;ctx.globalAlpha=.35+((i%3)*.15);ctx.fillStyle=i%2?'#ffb43e':'#ff6b24';ctx.fillRect(ex,ey,2,2)}ctx.restore();ctx.globalAlpha=1}
function moveLeaves(t,dt){const gy=H-38;for(const l of leaves){l.x+=l.v*dt;l.y=gy-4+Math.sin(t*.0017+l.p)*7;if(l.x>W+12){l.x=-12;l.p=Math.random()*20;l.v=11+Math.random()*20}ctx.save();ctx.translate(l.x,l.y);ctx.rotate(Math.sin(t*.0025+l.p)*.9);ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.restore()}}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();ctx.ellipse(x,y,w,5,0,0,Math.PI*2);ctx.fill()}
function drawWolf(a,t){if(!wolf.complete||!wolf.naturalWidth)return false;const cols=2,rows=3,sw=wolf.naturalWidth/cols,sh=wolf.naturalHeight/rows,frame=((t/150+a.phase*8)|0)%6,sx=(frame%2)*sw,sy=Math.floor(frame/2)*sh;const scale=a.rare?1.9:1.72,dw=sw*scale,dh=sh*scale;shadow(a.x,H-35,dw*.28);ctx.save();ctx.translate(a.x,H-34);if(a.dir<0)ctx.scale(-1,1);if(a.rare){ctx.shadowColor='rgba(99,210,255,.9)';ctx.shadowBlur=14}ctx.drawImage(wolf,sx,sy,sw,sh,-dw/2,-dh+13,dw,dh);ctx.restore();return true}
function forestCrop(a,t){if(!forest.complete||!forest.naturalWidth)return false;const sw=forest.naturalWidth/3,sh=forest.naturalHeight/3;let cell=0;if(a.kind==='dire')cell=4;if(a.kind==='frost')cell=5;if(a.kind==='bear')cell=6;if(a.kind==='boar')cell=0;const col=cell%3,row=Math.floor(cell/3);const bob=Math.sin(t*.003+a.phase)*1.5;const scale=a.rare?1.12:1.0,dw=sw*scale,dh=sh*scale;shadow(a.x,H-34,dw*.3);ctx.save();ctx.translate(a.x,H-34+bob);if(a.dir<0)ctx.scale(-1,1);if(a.rare){ctx.shadowColor='rgba(99,210,255,.85)';ctx.shadowBlur=14}ctx.drawImage(forest,col*sw,row*sh,sw,sh,-dw/2,-dh+14,dw,dh);ctx.restore();return true}
function fallback(a){ctx.fillStyle='#75838a';ctx.fillRect(a.x-30,H-86,60,46)}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);for(const a of actors){a.x+=a.dir*a.speed*dt;if(a.x<-90)a.dir=1;if(a.x>W+90)a.dir=-1;if(Math.random()<.0009)a.dir*=-1;const ok=a.kind==='wolf'?drawWolf(a,t):forestCrop(a,t);if(!ok)fallback(a)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
