<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1,V=[];const names=['Wolf','Bear','Raven','Boar','Stag','Dwarf','Troll','Rune Wolf','Frost Giant','Dragon'];function rs(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();function add(n){V.push({n:n||names[Math.floor(Math.random()*names.length)],px:Math.random()*W,dir:Math.random()<.5?-1:1,s:14+Math.random()*18,p:Math.random()*9,r:Math.random()<.035,dance:Math.random()*6})}for(let i=0;i<9;i++)add();function rr(a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fill()}function bg(t){let y=H-145,g=x.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(6,20,31,.05)');g.addColorStop(.35,'rgba(8,28,38,.32)');g.addColorStop(1,'rgba(4,17,24,.90)');x.fillStyle=g;x.fillRect(0,y,W,145);x.fillStyle='rgba(20,48,60,.50)';x.beginPath();x.moveTo(0,H-80);for(let q=0;q<=W;q+=110)x.lineTo(q,H-105-Math.sin(q*.012)*17);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='rgba(28,69,57,.88)';x.fillRect(0,H-62,W,62);x.fillStyle='rgba(65,78,78,.84)';x.fillRect(0,H-27,W,27);for(let q=55;q<W;q+=220){x.fillStyle='rgba(65,80,86,.94)';rr(q,H-66,20,31,4);x.strokeStyle='rgba(112,210,255,.9)';x.lineWidth=2;x.strokeRect(q+6,H-58,8,12)}const fx=W*.52,fy=H-39;x.fillStyle='rgba(104,60,35,.95)';x.fillRect(fx-14,fy+10,28,6);x.fillStyle='rgba(255,190,75,.98)';x.beginPath();x.moveTo(fx,fy-14-Math.sin(t*.015)*3);x.quadraticCurveTo(fx+11,fy,fx,fy+13);x.quadraticCurveTo(fx-11,fy,fx,fy-14);x.fill()}function creature(v,t){const dancing=Math.sin(t*.003+v.dance)>.78;let hop=Math.abs(Math.sin(t*(dancing?.014:.007)+v.p))*(dancing?9:3);let y=H-50-hop;let scale=(v.r?3.7:3.0);x.save();x.translate(v.px,y);if(v.dir<0)x.scale(-1,1);x.scale(scale,scale);if(v.r){x.shadowColor='#74d9ff';x.shadowBlur=10}let col=v.n.includes('Raven')?'#252c39':v.n.includes('Bear')?'#735c48':v.n.includes('Giant')?'#87b9d0':v.n.includes('Dragon')?'#4e9078':v.n.includes('Dwarf')?'#b77a55':v.n.includes('Boar')?'#795446':v.n.includes('Stag')?'#987451':v.n.includes('Troll')?'#668568':'#94a9b5';x.fillStyle=col;if(v.n.includes('Raven')){rr(-9,-18,15,11,2);rr(4,-24,9,8,2);x.fillStyle='#e4b85c';x.fillRect(12,-21,5,2);x.fillStyle=col;x.fillRect(-7,-7,3,7);x.fillRect(2,-7,3,7);if(dancing){x.fillRect(-14,-18,7,3);x.fillRect(3,-29,3,7)}}else if(v.n.includes('Dwarf')){x.fillStyle='#5d6870';rr(-8,-19,16,15,2);x.fillStyle='#d2aa82';rr(-6,-27,12,9,2);x.fillStyle='#a65b38';rr(-6,-18,12,9,2);x.fillStyle='#48535b';x.fillRect(-7,-4,5,5);x.fillRect(3,-4,5,5);x.fillStyle='#aebbc3';x.fillRect(8,-18,3,15);x.fillRect(10,-18,8,3)}else if(v.n.includes('Giant')||v.n.includes('Troll')){rr(-10,-25,20,21,3);rr(-8,-34,16,11,3);x.fillRect(-14,-22,5,16);x.fillRect(9,-22,5,16);x.fillRect(-8,-4,6,5);x.fillRect(2,-4,6,5)}else if(v.n.includes('Dragon')){rr(-13,-17,24,12,3);rr(7,-24,14,10,2);x.beginPath();x.moveTo(-8,-17);x.lineTo(-19,-31);x.lineTo(-16,-11);x.fill();x.beginPath();x.moveTo(2,-17);x.lineTo(12,-32);x.lineTo(14,-11);x.fill();x.fillRect(-11,-5,5,5);x.fillRect(5,-5,5,5)}else{rr(-15,-18,25,12,3);rr(7,-24,14,10,3);x.fillRect(-10,-6,5,6);x.fillRect(5,-6,5,6);if(v.n.includes('Wolf')){x.beginPath();x.moveTo(9,-24);x.lineTo(12,-32);x.lineTo(15,-24);x.fill();x.beginPath();x.moveTo(15,-24);x.lineTo(19,-31);x.lineTo(20,-23);x.fill();x.fillRect(-21,-17,8,4)}if(v.n.includes('Stag')){x.fillStyle='#c3a36c';x.fillRect(12,-32,2,9);x.fillRect(18,-32,2,9)}if(v.n.includes('Boar')){x.fillStyle='#e7d1a4';x.fillRect(19,-18,5,2)}}x.restore()}let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;x.clearRect(0,0,W,H);bg(t);for(const v of V){v.px+=v.dir*v.s*dt;if(v.px<-100)v.dir=1;if(v.px>W+100)v.dir=-1;if(Math.random()<.0013)v.dir*=-1;creature(v,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
