<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaxnir's Midgard Village</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W=0,H=0,D=1,last=performance.now(),start=performance.now();
const villagers=[],smoke=[],sparks=[],embers=[],grass=[],stones=[],birds=[];
let dragon=null,nextDragon=performance.now()+6500;

function resize(){
  D=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  if(!grass.length){
    for(let i=0;i<115;i++)grass.push({x:Math.random(),p:Math.random()*10,h:4+Math.random()*9});
    for(let i=0;i<80;i++)stones.push({x:Math.random(),y:Math.random(),w:2+Math.random()*7,h:1+Math.random()*3});
    for(let i=0;i<10;i++)villagers.push({
      x:.055+i*.092,dir:i%2?1:-1,s:7+Math.random()*5,p:Math.random()*10,
      lane:i%3,coat:['#657687','#7b573b','#4f6975','#704c48','#5c5d74'][i%5],
      hair:['#38271d','#a56e37','#d3b072','#24211e'][i%4],pause:Math.random()*2,
      carrying:i%4===0
    });
    for(let i=0;i<3;i++)birds.push({x:Math.random(),y:.3+Math.random()*.22,dir:i%2?1:-1,s:7+Math.random()*5,p:Math.random()*10});
  }
}
addEventListener('resize',resize);resize();

const groundY=()=>H-38;
function line(x1,y1,x2,y2,w,col){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function poly(points,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
  ctx.closePath();ctx.fill();
}
function rr(x,y,w,h,r,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function glow(x,y,r,col){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function woodPlanks(x,y,w,h){
  ctx.fillStyle='#3b2b22';ctx.fillRect(x,y,w,h);
  for(let px=0;px<w;px+=12){
    ctx.fillStyle=(px/12)%2?'#4a3427':'#543929';ctx.fillRect(x+px,y,8,h);
    ctx.fillStyle='rgba(203,159,98,.10)';ctx.fillRect(x+px+1,y+3,1,h-6);
  }
  ctx.fillStyle='rgba(13,10,8,.35)';ctx.fillRect(x,y+h-4,w,4);
}
function roof(x,y,w,h){
  poly([[x-8,y+h],[x+w*.5,y],[x+w+8,y+h]],'#121719');
  poly([[x+1,y+h-4],[x+w*.5,y+5],[x+w-1,y+h-4]],'#252d2d');
  for(let i=0;i<9;i++){
    const px=x+i*w/9;
    line(px,y+h-4,x+w*.5,y+5,1.4,'rgba(149,124,81,.23)');
  }
  line(x+w*.5-1,y+2,x+w*.5+1,y+2,5,'#816847');
}
function ground(t){
  const gy=groundY();
  const g=ctx.createLinearGradient(0,gy-50,0,H);
  g.addColorStop(0,'rgba(16,36,35,.00)');
  g.addColorStop(.18,'rgba(25,48,39,.91)');
  g.addColorStop(.38,'rgba(50,67,44,.98)');
  g.addColorStop(.43,'rgba(73,61,43,.99)');
  g.addColorStop(1,'rgba(29,24,21,.99)');
  ctx.fillStyle=g;ctx.fillRect(0,gy-49,W,H-gy+49);
  ctx.fillStyle='rgba(94,80,56,.78)';ctx.fillRect(0,gy-1,W,4);
  ctx.fillStyle='rgba(34,29,25,.72)';ctx.fillRect(0,H-17,W,17);

  for(const s of stones){
    const x=s.x*W,y=gy+4+s.y*27;
    ctx.fillStyle='rgba(102,98,88,.62)';ctx.fillRect(x,y,s.w,s.h);
    ctx.fillStyle='rgba(156,148,129,.22)';ctx.fillRect(x,y,s.w*.55,1);
  }
  for(const b of grass){
    const x=b.x*W,sw=Math.sin(t*.00115+b.p)*2.1;
    ctx.strokeStyle='rgba(101,132,82,.72)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,gy-2);ctx.lineTo(x+sw,gy-b.h);ctx.stroke();
  }
}
function distantPalisade(){
  const gy=groundY();
  for(let x=0;x<W;x+=17){
    const h=26+((x/17)%4)*4;
    poly([[x,gy-21],[x+7,gy-h],[x+14,gy-21],[x+14,gy+1],[x,gy+1]],'rgba(30,37,33,.48)');
  }
  ctx.fillStyle='rgba(23,28,26,.54)';ctx.fillRect(0,gy-13,W,4);
}
function windowLight(x,y){
  glow(x,y,24,'rgba(255,138,39,.22)');
  ctx.fillStyle='#e48b36';ctx.fillRect(x-6,y-5,12,11);
  ctx.fillStyle='#ffd77b';ctx.fillRect(x-3,y-3,6,6);
  line(x,y-5,x,y+6,1,'#5a3b21');line(x-6,y,x+6,y,1,'#5a3b21');
}
function longhouse(x,y,w,h,large=false){
  woodPlanks(x,y,w,h);
  ctx.fillStyle='#211710';ctx.fillRect(x+w*.43,y+h*.39,w*.14,h*.61);
  ctx.fillStyle='#79512a';ctx.fillRect(x+w*.47,y+h*.44,w*.06,h*.37);
  windowLight(x+w*.18,y+h*.52);
  windowLight(x+w*.75,y+h*.52);
  roof(x-3,y-(large?58:47),w+6,large?65:53);
  ctx.fillStyle='#57402f';ctx.fillRect(x+w*.76,y-(large?66:55),11,35);
  ctx.fillStyle='#1b1816';ctx.fillRect(x+w*.775,y-(large?69:58),7,9);
  if(Math.random()<.035)smoke.push({x:x+w*.795,y:y-(large?66:55),vx:-.05-Math.random()*.10,vy:-.18-Math.random()*.14,a:.32+Math.random()*.22,r:4+Math.random()*7});
}
function tower(x,y){
  woodPlanks(x,y-76,60,77);
  ctx.fillStyle='#261d17';ctx.fillRect(x-7,y-84,74,14);
  roof(x-13,y-125,86,43);
  line(x+7,y-71,x+7,y+1,4,'#756044');
  line(x+51,y-71,x+51,y+1,4,'#756044');
  line(x-5,y-35,x+65,y-35,4,'#756044');
  ctx.fillStyle='#101619';ctx.fillRect(x+22,y-65,15,19);
  ctx.fillStyle='#6d8da1';ctx.fillRect(x+27,y-61,5,11);
}
function forge(x,y,t){
  woodPlanks(x,y-56,118,57);roof(x-5,y-87,128,36);
  rr(x+11,y-37,45,35,5,'#171312');
  glow(x+34,y-17,48,'rgba(255,89,20,.28)');
  ctx.fillStyle='#b83b17';ctx.fillRect(x+18,y-29,34,21);
  ctx.fillStyle='#ff8d28';ctx.fillRect(x+25,y-24,21,13);
  ctx.fillStyle='#ffd36f';ctx.fillRect(x+31,y-20,10,7);
  ctx.fillStyle='#49433d';ctx.fillRect(x+78,y-28,28,8);ctx.fillRect(x+90,y-20,5,19);
  const down=Math.sin(t*.009)>0;
  line(x+82,y-(down?39:48),x+98,y-23,4,'#957a59');
  ctx.fillStyle='#30363a';ctx.fillRect(x+76,y-(down?42:51),15,6);
  if(down && Math.sin(t*.009)>.92){
    for(let i=0;i<5;i++)sparks.push({x:x+91,y:y-27,vx:(Math.random()-.5)*2,vy:-1-Math.random()*1.9,a:1});
  }
}
function well(x,y){
  ctx.fillStyle='#383733';ctx.fillRect(x,y-23,59,24);
  for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#777269':'#68645d';ctx.fillRect(x+i*12,y-23+(i%2)*2,10,6)}
  line(x+6,y-23,x+6,y-55,4,'#624a33');line(x+53,y-23,x+53,y-55,4,'#624a33');
  roof(x-3,y-71,64,21);line(x+29,y-55,x+29,y-31,2,'#8b765c');
}
function shrine(x,y,t){
  woodPlanks(x,y-53,75,54);roof(x-6,y-83,87,34);
  ctx.fillStyle='#4b3729';ctx.fillRect(x+12,y-43,51,44);
  const pulse=.72+.18*Math.sin(t*.003);
  ctx.globalAlpha=pulse;ctx.fillStyle='#5ac8eb';
  ctx.fillRect(x+34,y-38,8,25);ctx.fillRect(x+26,y-31,24,7);
  ctx.globalAlpha=1;glow(x+38,y-29,34,'rgba(62,186,226,.16)');
}
function banner(x,y,t,col='#3c6683'){
  line(x,y,x,y+60,3,'#735e43');
  const sw=Math.sin(t*.0024+x*.01)*5;
  ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x+1,y+5);ctx.lineTo(x+34+sw,y+10);ctx.lineTo(x+29+sw,y+34);ctx.lineTo(x+1,y+30);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(91,204,235,.7)';ctx.fillRect(x+9,y+14,4,11);ctx.fillRect(x+5,y+18,12,4);
}
function torch(x,y,t){
  line(x,y,x,y+44,3,'#65472f');
  const f=Math.sin(t*.021+x)*3;
  glow(x,y-3,25,'rgba(255,118,31,.20)');
  poly([[x-7,y+2],[x-4,y-12-f],[x,y-6],[x+3,y-17+f],[x+8,y+2]],'#d64b17');
  poly([[x-4,y+1],[x,y-10-f*.3],[x+4,y+1]],'#ffb33f');
}
function socialSigns(x,y,t){
  ctx.fillStyle='#251b15';ctx.fillRect(x+58,y-5,7,72);
  const items=[
    {dy:0,w:130,label:'TWITCH  /JAXNIR',col:'#553e6f'},
    {dy:27,w:138,label:'TIKTOK  @JAXNIR',col:'#3d5c67'},
    {dy:54,w:144,label:'YOUTUBE  /JAXNIR',col:'#6e3d3d'}
  ];
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){
    const yy=y+it.dy;
    ctx.save();ctx.translate(x+62,yy);ctx.rotate(Math.sin(t*.0012+it.dy)*.008);
    ctx.fillStyle='#1d1511';ctx.fillRect(-it.w/2-3,-11,it.w+6,23);
    ctx.fillStyle='#5b402b';ctx.fillRect(-it.w/2,-9,it.w,19);
    ctx.fillStyle='rgba(173,132,77,.16)';ctx.fillRect(-it.w/2+3,-7,it.w-6,2);
    ctx.fillStyle=it.col;ctx.fillRect(-it.w/2+5,6,it.w-10,2);
    ctx.font='bold 11px Georgia,serif';ctx.fillStyle='#e8dbc0';
    ctx.fillText(it.label,0,0);
    ctx.restore();
  }
  torch(x-18,y+52,t);torch(x+142,y+52,t);
  ctx.textAlign='start';ctx.textBaseline='alphabetic';
}
function boat(x,y,t){
  poly([[x,y],[x+92,y],[x+76,y+16],[x+18,y+16]],'#3f2d21');
  ctx.fillStyle='#745034';ctx.fillRect(x+14,y+4,65,5);
  line(x+46,y-58,x+46,y+7,3,'#765b3d');
  const sw=Math.sin(t*.0015)*3;
  poly([[x+48,y-53],[x+84+sw,y-38],[x+48,y-22]],'#3d627e');
  ctx.fillStyle='#7299ad';ctx.fillRect(x+53,y-43,4,13);
  for(let i=0;i<4;i++)line(x+20+i*15,y+10,x+6+i*15,y+23,2,'#8b6947');
}
function cart(x,y){
  ctx.fillStyle='#493426';ctx.fillRect(x,y-20,50,18);ctx.fillStyle='#6d4c31';ctx.fillRect(x+4,y-17,42,8);
  for(const wx of [x+8,x+42]){ctx.strokeStyle='#261b15';ctx.lineWidth=4;ctx.beginPath();ctx.arc(wx,y,8,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#8b6d4b';ctx.lineWidth=1;ctx.beginPath();ctx.arc(wx,y,5,0,Math.PI*2);ctx.stroke()}
}
function villager(v,t,dt){
  if(v.pause>0)v.pause-=dt;
  else{
    v.x+=v.dir*v.s*dt/W;
    if(Math.random()<.0013)v.pause=.5+Math.random()*1.8;
  }
  if(v.x<.02){v.x=.02;v.dir=1} if(v.x>.98){v.x=.98;v.dir=-1}
  if(Math.random()<.0006)v.dir*=-1;
  const x=v.x*W,y=groundY()-3-v.lane*5,walk=v.pause>0?0:Math.sin(t*.012+v.p)*4;
  ctx.save();ctx.translate(x,y);if(v.dir<0)ctx.scale(-1,1);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,1,10,3,0,0,Math.PI*2);ctx.fill();
  line(-3,-9,-4+walk,-1,3,'#2c2521');line(3,-9,4-walk,-1,3,'#2c2521');
  poly([[-8,-29],[7,-29],[10,-9],[-10,-9]],v.coat);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(-5,-27,3,14);
  ctx.fillStyle='#3c2b22';ctx.fillRect(-9,-17,18,3);ctx.fillStyle='#9d7b47';ctx.fillRect(-1,-18,3,4);
  ctx.fillStyle='#bd8b67';ctx.beginPath();ctx.arc(0,-36,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=v.hair;ctx.beginPath();ctx.arc(-1,-38,6,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-6,-38,3,7);
  line(7,-25,10,-14,3,'#bd8b67');
  if(v.carrying){ctx.fillStyle='#6a4b31';ctx.fillRect(8,-21,10,9);ctx.strokeStyle='#3c2a1e';ctx.strokeRect(8,-21,10,9)}
  ctx.restore();
}
function smokeTick(dt){
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];s.x+=s.vx;s.y+=s.vy;s.a-=.0035;s.r+=.018;
    if(s.a<=0){smoke.splice(i,1);continue}
    ctx.fillStyle=`rgba(126,139,143,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
}
function sparkTick(){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.a-=.045;
    if(s.a<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`rgba(255,174,61,${s.a})`;ctx.fillRect(s.x,s.y,2,2);
  }
}
function birdTick(b,t,dt){
  b.x+=b.dir*b.s*dt/W;if(b.x<-.05)b.x=1.05;if(b.x>1.05)b.x=-.05;
  const x=b.x*W,y=H*b.y+Math.sin(t*.002+b.p)*8,wing=Math.sin(t*.013+b.p)*5;
  ctx.save();ctx.translate(x,y);if(b.dir<0)ctx.scale(-1,1);
  ctx.strokeStyle='rgba(35,47,54,.72)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.quadraticCurveTo(-1,-wing,3,0);ctx.quadraticCurveTo(7,-wing,11,0);ctx.stroke();ctx.restore();
}
function spawnDragon(t){
  const dir=Math.random()<.5?1:-1;
  dragon={dir,x:dir===1?-190:W+190,y:Math.max(90,H*.30),speed:85+Math.random()*35,phase:Math.random()*10,scale:.92+Math.random()*.26};
}
function drawDragon(t,dt){
  if(!dragon){if(t>=nextDragon)spawnDragon(t);return}
  const d=dragon;d.x+=d.dir*d.speed*dt;
  const y=d.y+Math.sin(t*.0016+d.phase)*24,flap=Math.sin(t*.0075+d.phase);
  ctx.save();ctx.translate(d.x,y);if(d.dir<0)ctx.scale(-1,1);ctx.scale(d.scale,d.scale);
  glow(0,0,82,'rgba(53,119,170,.08)');
  ctx.strokeStyle='#101a20';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-52,5);ctx.quadraticCurveTo(-95,16,-124,3);ctx.stroke();
  ctx.strokeStyle='#263b49';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-52,3);ctx.quadraticCurveTo(-94,13,-121,2);ctx.stroke();
  ctx.fillStyle='#111a20';ctx.beginPath();ctx.ellipse(-14,2,49,22,-.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#253a47';ctx.beginPath();ctx.ellipse(-10,-2,38,14,-.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#111a20';ctx.lineWidth=20;ctx.beginPath();ctx.moveTo(20,-5);ctx.quadraticCurveTo(45,-25,65,-16);ctx.stroke();
  poly([[57,-25],[84,-21],[98,-12],[79,-5],[58,-8]],'#142029');
  poly([[68,-21],[89,-16],[80,-12],[65,-13]],'#304b5b');
  ctx.fillStyle='#69d4ff';ctx.fillRect(80,-18,4,3);
  poly([[66,-24],[62,-39],[72,-27]],'#0b1216');poly([[77,-21],[79,-35],[84,-23]],'#0b1216');
  const up=flap*26;
  poly([[-22,-7],[-78,-52-up],[-53,-7-up*.35],[-90,-20-up*.25],[-45,11]],'#101820');
  poly([[-3,-9],[33,-63-up],[28,-16-up*.28],[60,-34-up*.2],[34,6]],'#101820');
  poly([[-18,-9],[-66,-44-up],[-44,-11-up*.3],[-72,-21-up*.2],[-39,6]],'#2a4050');
  poly([[1,-10],[27,-52-up],[23,-15-up*.24],[49,-29-up*.16],[29,3]],'#2a4050');
  line(-28,16,-36,36,7,'#101820');line(7,16,15,36,7,'#101820');
  line(-36,36,-45,40,3,'#263b49');line(15,36,24,40,3,'#263b49');
  ctx.restore();
  if((d.dir===1&&d.x>W+210)||(d.dir===-1&&d.x<-210)){
    dragon=null;nextDragon=t+35000+Math.random()*30000;
  }
}
function scene(t,dt){
  const gy=groundY();
  ground(t);distantPalisade();
  boat(W*.01,gy-3,t);banner(W*.125,gy-128,t,'#355f7a');banner(W*.87,gy-130,t,'#603950');
  tower(W*.145,gy-2);
  longhouse(W*.205,gy-88,W*.16,89,false);
  well(W*.375,gy-1);
  longhouse(W*.425,gy-103,W*.19,104,true);
  shrine(W*.63,gy-1,t);
  forge(W*.705,gy-1,t);
  longhouse(W*.82,gy-79,W*.135,80,false);
  cart(W*.325,gy-2);
  torch(W*.397,gy-10,t);
  torch(W*.612,gy-10,t);
  socialSigns(W*.89,gy-151,t);
  const fx=W*.515,fy=gy-3;
  ctx.fillStyle='rgba(20,16,14,.65)';ctx.beginPath();ctx.ellipse(fx,fy+4,33,7,0,0,Math.PI*2);ctx.fill();
  for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ctx.fillStyle='#71675a';ctx.beginPath();ctx.arc(fx+Math.cos(a)*25,fy+Math.sin(a)*6,4,0,Math.PI*2);ctx.fill()}
  glow(fx,fy-12,45,'rgba(255,100,24,.22)');
  const f=Math.sin(t*.025)*6;
  poly([[fx-10,fy],[fx-7,fy-20-f],[fx,fy-10],[fx+4,fy-30+f],[fx+11,fy]],'#d84d17');
  poly([[fx-5,fy],[fx,fy-17-f*.3],[fx+6,fy]],'#ffb039');
  for(const v of villagers)villager(v,t,dt);
  for(const b of birds)birdTick(b,t,dt);
  smokeTick(dt);sparkTick();drawDragon(t,dt);
}
function loop(t){
  const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);
  scene(t,dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
