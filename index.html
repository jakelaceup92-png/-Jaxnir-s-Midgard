<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,D=1,last=performance.now();
const IMG={};function load(k,u){const i=new Image();i.src=u;IMG[k]=i}

const ramBase=(step)=>`<svg xmlns="http://www.w3.org/2000/svg" width="120" height="88" viewBox="0 0 120 88" shape-rendering="crispEdges"><g stroke="#17151b" stroke-width="3" stroke-linejoin="miter"><path fill="#9f9995" d="M16 48 19 35 27 27 39 23 55 24 68 28 80 33 91 39 96 49 92 57 82 60 70 57 58 58 53 77 41 77 39 ${step?61:58} 29 60 25 77 14 77 16 ${step?61:64} 10 57Z"/><path fill="#d1cbc5" d="M22 43 26 33 36 27 50 27 62 30 73 35 82 40 77 49 64 52 50 49 39 51 27 55 18 52Z"/><path fill="#e7e2dc" d="M31 34 40 29 53 29 63 32 70 36 63 39 52 38 43 41 32 43 26 40Z"/><path fill="#b8b0ad" d="M77 36 90 34 101 39 108 45 108 52 102 57 91 56 84 51 80 45Z"/><path fill="#d9d2ce" d="M87 39 98 39 105 43 106 48 101 52 91 52 85 48Z"/><rect fill="#27232a" x="97" y="42" width="3" height="3"/><rect fill="#d8bd78" x="91" y="39" width="3" height="3"/><path fill="#3a2d42" d="M75 36 72 24 75 13 83 7 94 7 105 13 111 23 110 34 103 42 93 46 84 43 79 37 79 30 83 25 90 23 96 26 97 32 93 36 88 35 86 32 89 29 92 30 92 32 90 33 89 31"/><path fill="#6d5379" d="M79 34 76 25 79 17 85 12 94 12 102 17 106 24 105 32 100 38 93 41 86 39 82 35 82 30 85 27 90 27 93 29 93 32 90 34 87 33 86 31 88 29"/><path fill="#9a7cad" d="M83 30 82 23 86 17 93 16 99 19 102 24 101 30 98 34 93 36 88 35 85 32 85 29 88 27 91 28 91 31 89 32"/><path fill="#6f686c" d="M39 57 51 57 49 ${step?70:77} 41 79 38 75ZM71 57 83 57 82 ${step?77:70} 74 79 70 75Z"/><path fill="#26232a" d="M39 76 51 76 50 81 38 81ZM70 76 83 76 83 81 70 81Z"/><path fill="#aba4a1" d="M18 47 11 42 6 47 12 52Z"/><path fill="#beb7b3" d="M34 31 38 29 42 30 39 32ZM48 44 53 42 58 43 54 45ZM28 50 33 48 36 49 33 51ZM58 33 63 33 66 35 62 36Z"/></g></svg>`;
svgImage('ram0',ramBase(0));svgImage('ram1',ramBase(1));
const ravenUp=`<svg xmlns="http://www.w3.org/2000/svg" width="112" height="82" viewBox="0 0 112 82" shape-rendering="crispEdges"><g stroke="#090b13" stroke-width="3" stroke-linejoin="miter"><path fill="#141b28" d="M19 49 24 33 37 23 52 21 65 25 74 32 88 33 101 38 108 42 102 47 91 47 82 52 70 63 55 65 41 60 30 57Z"/><path fill="#24334a" d="M28 44 35 30 47 24 59 25 69 31 74 38 68 46 57 51 44 50 34 48Z"/><path fill="#50497d" d="M34 36 44 28 55 28 64 32 67 36 60 38 51 35 44 40Z"/><path fill="#7163a3" d="M40 44 48 37 58 38 66 42 59 47 50 48Z"/><path fill="#182336" d="M67 29 79 22 91 24 101 31 105 38 99 43 87 42 77 37Z"/><path fill="#36516c" d="M78 27 91 27 102 34 105 38 97 40 84 35Z"/><path fill="#a9d9f1" d="M94 31 103 36 98 39 89 35Z"/><rect fill="#98d4ff" x="79" y="28" width="4" height="4"/><rect fill="#090b13" x="80" y="29" width="2" height="2"/><path fill="#101724" d="M29 48 12 47 21 39 37 41ZM35 52 15 59 28 45 43 44ZM47 55 26 69 39 47 55 46Z"/><path fill="#2c3554" d="M42 43 20 26 39 33 50 40ZM49 39 34 18 55 31 60 40Z"/><path fill="#50497d" d="M38 34 29 27 41 31ZM45 31 39 22 51 30Z"/><path fill="#202b42" d="M59 49 72 52 65 60 53 59Z"/></g></svg>`;
const ravenDown=`<svg xmlns="http://www.w3.org/2000/svg" width="112" height="82" viewBox="0 0 112 82" shape-rendering="crispEdges"><g stroke="#090b13" stroke-width="3" stroke-linejoin="miter"><path fill="#141b28" d="M18 45 24 30 37 22 52 21 65 25 74 31 88 32 101 37 108 41 102 46 91 46 82 51 70 61 55 64 41 59 29 55Z"/><path fill="#24334a" d="M28 41 35 29 47 24 59 25 69 30 74 37 68 45 57 49 44 48 34 46Z"/><path fill="#50497d" d="M34 34 44 28 55 28 64 31 67 35 60 37 51 34 44 39Z"/><path fill="#7163a3" d="M40 42 48 36 58 37 66 41 59 45 50 46Z"/><path fill="#182336" d="M67 28 79 21 91 23 101 30 105 37 99 42 87 41 77 36Z"/><path fill="#36516c" d="M78 26 91 26 102 33 105 37 97 39 84 34Z"/><path fill="#a9d9f1" d="M94 30 103 35 98 38 89 34Z"/><rect fill="#98d4ff" x="79" y="27" width="4" height="4"/><rect fill="#090b13" x="80" y="28" width="2" height="2"/><path fill="#101724" d="M28 48 12 54 27 40 40 43ZM38 51 20 68 34 44 47 45ZM50 53 40 76 44 47 58 46Z"/><path fill="#2c3554" d="M44 49 27 69 39 45 52 42ZM52 48 43 72 48 42 61 40Z"/><path fill="#50497d" d="M38 56 31 64 39 51ZM48 57 44 67 48 51Z"/><path fill="#202b42" d="M59 47 72 50 65 58 53 57Z"/></g></svg>`;
svgImage('raven0',ravenUp);svgImage('raven1',ravenDown);
const actors=[],leaves=[],stones=[],tufts=[];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;if(!stones.length){for(let i=0;i<44;i++)stones.push({x:Math.random()*W,y:Math.random(),w:3+Math.random()*9,h:2+Math.random()*4});for(let i=0;i<36;i++)tufts.push({x:Math.random()*W,y:Math.random(),s:.7+Math.random()*.7,p:Math.random()*20})}}
addEventListener('resize',resize);resize();
function add(kind,x,lane,dir,speed,scale=1){actors.push({kind,x,lane,dir,speed,scale,phase:Math.random()*30})}
add('wolf',W*.05,0,1,17,1);add('stag',W*.25,1,1,12,1.01);add('bear',W*.44,2,-1,8,.96);add('ram',W*.69,1,-1,11,.95);add('wolf',W*.88,0,-1,15,.98);add('raven',W*.18,0,1,25,.78);add('raven',W*.80,0,-1,22,.74);
for(let i=0;i<28;i++)leaves.push({x:Math.random()*W,v:10+Math.random()*20,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.5?'#9a6234':'#6f492e'});
function grassPatch(x,y,t,s,p){ctx.lineWidth=1;for(let i=-8;i<=8;i+=4){const sw=Math.sin(t*.001+p+i*.2)*2.8*s;ctx.strokeStyle=i%8===0?'rgba(127,153,101,.82)':'rgba(73,111,72,.8)';ctx.beginPath();ctx.moveTo(x+i*s,y);ctx.lineTo(x+i*s+sw,y-(7+Math.abs(i%7))*s);ctx.stroke()}}
function ground(t){const top=H-62,g=ctx.createLinearGradient(0,top-60,0,H);g.addColorStop(0,'rgba(3,10,17,0)');g.addColorStop(.55,'rgba(5,15,20,.08)');g.addColorStop(1,'rgba(2,7,9,.62)');ctx.fillStyle=g;ctx.fillRect(0,top-60,W,122);ctx.fillStyle='rgba(18,35,37,.3)';ctx.beginPath();ctx.moveTo(0,top+5);for(let x=0;x<=W;x+=55)ctx.lineTo(x,top-10-Math.sin(x*.013+1.3)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(41,65,47,.95)';ctx.beginPath();ctx.moveTo(0,top+4);for(let x=0;x<=W;x+=14)ctx.lineTo(x,top+Math.sin(x*.03)*2);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(57,50,38,.90)';ctx.fillRect(0,H-43,W,43);ctx.fillStyle='rgba(69,59,43,.8)';ctx.fillRect(0,H-38,W,5);for(const s of stones){const y=H-39+s.y*27;ctx.fillStyle='rgba(82,81,73,.76)';ctx.fillRect(s.x,y-s.h,s.w,s.h);ctx.fillStyle='rgba(135,132,115,.36)';ctx.fillRect(s.x+1,y-s.h,s.w*.55,1)}for(const u of tufts)grassPatch(u.x,H-39+u.y*19,t,u.s,u.p);for(let x=2;x<W;x+=7){const sw=Math.sin(t*.001+x*.052)*2.6;ctx.strokeStyle=x%28===0?'rgba(139,164,110,.85)':'rgba(77,117,77,.76)';ctx.beginPath();ctx.moveTo(x,top+3);ctx.lineTo(x+sw,top-5-(x%6));ctx.stroke()}}
function fire(t){const fx=W*.51,base=H-42;ctx.save();ctx.fillStyle='rgba(39,29,24,.92)';ctx.beginPath();ctx.ellipse(fx,base+17,43,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3022';ctx.save();ctx.translate(fx,base+10);ctx.rotate(.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.save();ctx.translate(fx,base+10);ctx.rotate(-.15);ctx.fillRect(-34,-4,68,8);ctx.restore();const f1=Math.sin(t*.027)*9,f2=Math.sin(t*.041+1.2)*7,f3=Math.sin(t*.019+2.4)*8;ctx.shadowColor='rgba(255,112,28,.98)';ctx.shadowBlur=31;ctx.fillStyle='rgba(224,65,18,.98)';ctx.beginPath();ctx.moveTo(fx-21,base+7);ctx.quadraticCurveTo(fx-16,base-25-f1,fx-6,base-42-f2);ctx.quadraticCurveTo(fx,base-17,fx+6,base-51-f3);ctx.quadraticCurveTo(fx+17,base-23,fx+22,base+7);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,139,28,.99)';ctx.beginPath();ctx.moveTo(fx-13,base+6);ctx.quadraticCurveTo(fx-6,base-26-f2*.7,fx+1,base-35-f1*.5);ctx.quadraticCurveTo(fx+7,base-12,fx+14,base+6);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,232,126,1)';ctx.beginPath();ctx.moveTo(fx-5,base+5);ctx.quadraticCurveTo(fx,base-15-f3*.4,fx+4,base-23);ctx.quadraticCurveTo(fx+8,base-8,fx+8,base+5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(let i=0;i<13;i++){const ey=base-12-((t*.04+i*11)%50),ex=fx+Math.sin(t*.004+i*1.7)*21;ctx.globalAlpha=.3+((i%4)*.13);ctx.fillStyle=i%2?'#ffc052':'#ff6b24';ctx.fillRect(ex,ey,2+(i%2),2+(i%2))}ctx.restore();ctx.globalAlpha=1}
function moveLeaves(t,dt){const top=H-61;for(const l of leaves){l.x+=l.v*dt;const y=top+8+Math.sin(t*.0017+l.p)*11+Math.abs(Math.sin(t*.0008+l.p))*18;if(l.x>W+15){l.x=-15;l.p=Math.random()*20}ctx.save();ctx.translate(l.x,y);ctx.rotate(Math.sin(t*.0025+l.p)*1.1);ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.restore()}}
function shadow(x,y,w,a=.34){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(x,y,w,5,0,0,Math.PI*2);ctx.fill()}
function gy(a){return H-54+a.lane*8}
function drawWolf(a,t){const im=IMG.wolf;if(!im.complete||!im.naturalWidth)return;const sw=im.naturalWidth/2,sh=im.naturalHeight/3,fr=((t/165+a.phase*8)|0)%6,sx=(fr%2)*sw,sy=Math.floor(fr/2)*sh,sc=1.69*a.scale,y=gy(a),dw=sw*sc,dh=sh*sc;shadow(a.x,y,dw*.28,.31);ctx.save();ctx.translate(Math.round(a.x),Math.round(y+1));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,sx,sy,sw,sh,Math.round(-dw/2),Math.round(-dh+13),Math.round(dw),Math.round(dh));ctx.fillStyle='#efe7d8';ctx.fillRect(Math.round(dw*.28),Math.round(-dh*.58),3,2);ctx.fillStyle='#151719';ctx.fillRect(Math.round(dw*.31),Math.round(-dh*.60),2,2);ctx.restore()}
function drawStag(a,t){const im=IMG.stag;if(!im.complete||!im.naturalWidth)return;const sw=32,sh=32,fr=((t/185+a.phase)|0)%5,sx=fr*sw,sy=64,sc=3.12*a.scale,y=gy(a),dw=sw*sc,dh=sh*sc;shadow(a.x,y,dw*.31,.30);ctx.save();ctx.translate(Math.round(a.x),Math.round(y+1));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,sx,sy,sw,sh,Math.round(-dw/2),Math.round(-dh+8),Math.round(dw),Math.round(dh));const fx=Math.round(dw*.27),fy=Math.round(-dh*.64);ctx.fillStyle='#201713';ctx.fillRect(fx,fy,3,3);ctx.fillStyle='#e3c28c';ctx.fillRect(fx+5,fy+7,9,3);ctx.fillStyle='#9c724f';ctx.fillRect(fx+3,fy+3,7,2);ctx.fillStyle='#5b3e2c';ctx.fillRect(fx+9,fy+9,6,2);ctx.fillStyle='#c99d6b';ctx.fillRect(fx-4,fy-5,4,3);ctx.restore()}
function drawWalkPair(a,key0,key1,w,h,sc,t,rate,yoff=8){const im=IMG[((t/rate+a.phase)|0)%2?key1:key0];if(!im||!im.complete||!im.naturalWidth)return;const y=gy(a),dw=w*sc*a.scale,dh=h*sc*a.scale;shadow(a.x,y,dw*.29,.32);ctx.save();ctx.translate(Math.round(a.x),Math.round(y+1));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,Math.round(-dw/2),Math.round(-dh+yoff),Math.round(dw),Math.round(dh));ctx.restore()}
function flightY(a,t){const top=Math.max(78,H*.23),bottom=Math.max(top+34,H*.43);return Math.max(top,Math.min(bottom,(top+bottom)/2+Math.sin(t*.00115+a.phase)*12))}
function drawRaven(a,t){const im=IMG[((t/145+a.phase)|0)%2?'raven1':'raven0'];if(!im||!im.complete||!im.naturalWidth)return;const y=flightY(a,t),dw=112*.93*a.scale,dh=82*.93*a.scale;ctx.save();ctx.translate(Math.round(a.x),Math.round(y));if(a.dir<0)ctx.scale(-1,1);ctx.rotate(Math.sin(t*.0038+a.phase)*.025);ctx.drawImage(im,Math.round(-dw/2),Math.round(-dh/2),Math.round(dw),Math.round(dh));ctx.restore()}
function draw(a,t){if(a.kind==='wolf')drawWolf(a,t);else if(a.kind==='stag')drawStag(a,t);else if(a.kind==='bear')drawWalkPair(a,'bear0','bear1',128,88,.82,t,230,9);else if(a.kind==='ram')drawWalkPair(a,'ram0','ram1',120,88,.84,t,210,9);else drawRaven(a,t)}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);for(const a of actors){a.x+=a.dir*a.speed*dt;if(a.x<-130)a.dir=1;if(a.x>W+130)a.dir=-1;if(Math.random()<.0007)a.dir*=-1;draw(a,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
