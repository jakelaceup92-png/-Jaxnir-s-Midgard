<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,d=1,V=[];const names=['Wolf','Bear','Raven','Boar','Stag','Dwarf','Troll','Rune Wolf','Frost Giant','Dragon'];function rs(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',rs);rs();function add(n){V.push({n:n||names[Math.floor(Math.random()*names.length)],px:Math.random()*W,dir:Math.random()<.5?-1:1,s:20+Math.random()*25,p:Math.random()*9,r:Math.random()<.03})}for(let i=0;i<12;i++)add();function rr(a,b,w,h,r){x.beginPath();if(x.roundRect){x.roundRect(a,b,w,h,r)}else{x.rect(a,b,w,h)}x.fill()}function bg(t){let y=H-92,g=x.createLinearGradient(0,y,0,H);g.addColorStop(0,'rgba(7,19,30,.20)');g.addColorStop(1,'rgba(4,17,24,.90)');x.fillStyle=g;x.fillRect(0,y,W,92);x.fillStyle='rgba(22,51,62,.58)';x.beginPath();x.moveTo(0,H-56);for(let q=0;q<=W;q+=90)x.lineTo(q,H-64-Math.sin(q*.015)*10);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.fillStyle='rgba(29,67,57,.85)';x.fillRect(0,H-54,W,54);x.fillStyle='rgba(65,78,78,.82)';x.fillRect(0,H-24,W,24);for(let q=40;q<W;q+=160){x.fillStyle='rgba(67,82,87,.92)';rr(q,H-52,16,25,3);x.strokeStyle='rgba(112,210,255,.8)';x.strokeRect(q+5,H-45,6,9)}const fx=W*.53,fy=H-33;x.fillStyle='rgba(104,60,35,.9)';x.fillRect(fx-10,fy+8,20,4);x.fillStyle='rgba(255,190,75,.95)';x.beginPath();x.moveTo(fx,fy-8-Math.sin(t*.015)*2);x.quadraticCurveTo(fx+8,fy,fx,fy+10);x.quadraticCurveTo(fx-8,fy,fx,fy-8);x.fill()}function creature(v,t){let hop=Math.abs(Math.sin(t*.008+v.p))*8,y=H-41-hop,s=v.r?1.4:1;x.save();x.translate(v.px,y);if(v.dir<0)x.scale(-1,1);x.scale(s,s);if(v.r){x.shadowColor='#74d9ff';x.shadowBlur=18}let col=v.n.includes('Raven')?'#222a35':v.n.includes('Bear')?'#735c48':v.n.includes('Giant')?'#87b9d0':v.n.includes('Dragon')?'#4e9078':v.n.includes('Dwarf')?'#b77a55':'#94a9b5';x.fillStyle=col;rr(-19,-25,31,17,4);rr(8,-33,18,15,4);rr(-13,-10,7,10,2);rr(6,-10,7,10,2);if(v.n.includes('Wolf')){x.beginPath();x.moveTo(10,-32);x.lineTo(14,-43);x.lineTo(18,-32);x.fill();x.beginPath();x.moveTo(16,-32);x.lineTo(21,-42);x.lineTo(23,-31);x.fill();x.fillRect(-25,-23,10,5)}if(v.n.includes('Raven')){x.fillStyle='#e4b85c';x.fillRect(24,-28,7,3)}if(v.n.includes('Stag')){x.fillStyle='#c3a36c';x.fillRect(16,-43,2,12);x.fillRect(23,-43,2,12)}x.restore();x.font='bold 11px Arial';x.textAlign='center';x.fillStyle='rgba(232,248,255,.95)';x.fillText(v.n,v.px,y-43)}let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;x.clearRect(0,0,W,H);bg(t);for(const v of V){v.px+=v.dir*v.s*dt;if(v.px<-45)v.dir=1;if(v.px>W+45)v.dir=-1;if(Math.random()<.0015)v.dir*=-1;creature(v,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
