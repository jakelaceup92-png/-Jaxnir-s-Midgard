<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,D=1,last=performance.now();
const wolf=new Image();wolf.crossOrigin='anonymous';wolf.src='https://opengameart.org/sites/default/files/wolf%20walk.png';
const actors=[],leaves=[],stones=[],tufts=[];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;if(!stones.length){for(let i=0;i<46;i++)stones.push({x:Math.random()*W,y:Math.random(),w:3+Math.random()*10,h:2+Math.random()*5});for(let i=0;i<38;i++)tufts.push({x:Math.random()*W,y:Math.random(),s:.7+Math.random()*.7,p:Math.random()*20})}}
addEventListener('resize',resize);resize();
for(let i=0;i<8;i++)actors.push({x:Math.random()*W,dir:Math.random()<.5?-1:1,speed:10+Math.random()*13,phase:Math.random()*20,lane:i%3,scale:.96+Math.random()*.08});
for(let i=0;i<30;i++)leaves.push({x:Math.random()*W,v:10+Math.random()*22,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.5?'#9a6234':'#6f492e'});
function grassPatch(x,y,t,s,p){ctx.lineWidth=1;for(let i=-8;i<=8;i+=4){const sway=Math.sin(t*.001+p+i*.2)*2.8*s;ctx.strokeStyle=i%8===0?'rgba(127,153,101,.82)':'rgba(73,111,72,.8)';ctx.beginPath();ctx.moveTo(x+i*s,y);ctx.lineTo(x+i*s+sway,y-(7+Math.abs(i%7))*s);ctx.stroke()}}
function ground(t){const top=H-62;let g=ctx.createLinearGradient(0,top-65,0,H);g.addColorStop(0,'rgba(3,10,17,0)');g.addColorStop(.52,'rgba(5,15,20,.08)');g.addColorStop(1,'rgba(2,7,9,.62)');ctx.fillStyle=g;ctx.fillRect(0,top-65,W,127);ctx.fillStyle='rgba(18,35,37,.30)';ctx.beginPath();ctx.moveTo(0,top+5);for(let x=0;x<=W;x+=55)ctx.lineTo(x,top-10-Math.sin(x*.013+1.3)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(41,65,47,.96)';ctx.beginPath();ctx.moveTo(0,top+4);for(let x=0;x<=W;x+=14)ctx.lineTo(x,top+Math.sin(x*.03)*2);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='rgba(57,50,38,.90)';ctx.fillRect(0,H-43,W,43);ctx.fillStyle='rgba(69,59,43,.8)';ctx.fillRect(0,H-38,W,5);ctx.fillStyle='rgba(39,34,28,.42)';ctx.fillRect(0,H-17,W,17);for(const s of stones){const y=H-39+s.y*27;ctx.fillStyle='rgba(82,81,73,.76)';ctx.fillRect(s.x,y-s.h,s.w,s.h);ctx.fillStyle='rgba(135,132,115,.36)';ctx.fillRect(s.x+1,y-s.h,s.w*.55,1)}for(const u of tufts)grassPatch(u.x,H-39+u.y*19,t,u.s,u.p);for(let x=2;x<W;x+=7){const sway=Math.sin(t*.001+x*.052)*2.6;ctx.strokeStyle=x%28===0?'rgba(139,164,110,.85)':'rgba(77,117,77,.76)';ctx.beginPath();ctx.moveTo(x,top+3);ctx.lineTo(x+sway,top-5-(x%6));ctx.stroke()}}
function fire(t){const fx=W*.51,base=H-42;ctx.save();ctx.fillStyle='rgba(39,29,24,.92)';ctx.beginPath();ctx.ellipse(fx,base+17,43,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3022';ctx.save();ctx.translate(fx,base+10);ctx.rotate(.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.save();ctx.translate(fx,base+10);ctx.rotate(-.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.fillStyle='rgba(114,72,42,.92)';ctx.fillRect(fx-27,base+6,54,6);const f1=Math.sin(t*.027)*9,f2=Math.sin(t*.041+1.2)*7,f3=Math.sin(t*.019+2.4)*8;ctx.shadowColor='rgba(255,112,28,.98)';ctx.shadowBlur=31;ctx.fillStyle='rgba(224,65,18,.98)';ctx.beginPath();ctx.moveTo(fx-21,base+7);ctx.quadraticCurveTo(fx-16,base-25-f1,fx-6,base-42-f2);ctx.quadraticCurveTo(fx,base-17,fx+6,base-51-f3);ctx.quadraticCurveTo(fx+17,base-23,fx+22,base+7);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,139,28,.99)';ctx.beginPath();ctx.moveTo(fx-13,base+6);ctx.quadraticCurveTo(fx-6,base-26-f2*.7,fx+1,base-35-f1*.5);ctx.quadraticCurveTo(fx+7,base-12,fx+14,base+6);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,232,126,1)';ctx.beginPath();ctx.moveTo(fx-5,base+5);ctx.quadraticCurveTo(fx,base-15-f3*.4,fx+4,base-23);ctx.quadraticCurveTo(fx+8,base-8,fx+8,base+5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(let i=0;i<13;i++){const ey=base-12-((t*.04+i*11)%50),ex=fx+Math.sin(t*.004+i*1.7)*21;ctx.globalAlpha=.3+((i%4)*.13);ctx.fillStyle=i%2?'#ffc052':'#ff6b24';ctx.fillRect(ex,ey,2+(i%2),2+(i%2))}ctx.restore();ctx.globalAlpha=1}
function moveLeaves(t,dt){const top=H-61;for(const l of leaves){l.x+=l.v*dt;const y=top+8+Math.sin(t*.0017+l.p)*11+Math.abs(Math.sin(t*.0008+l.p))*18;if(l.x>W+15){l.x=-15;l.p=Math.random()*20;l.v=10+Math.random()*22}ctx.save();ctx.translate(l.x,y);ctx.rotate(Math.sin(t*.0025+l.p)*1.1);ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.fillRect(0,-2,1,3);ctx.restore()}}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();ctx.ellipse(x,y,w,5,0,0,Math.PI*2);ctx.fill()}
function drawWolf(a,t){if(!wolf.complete||!wolf.naturalWidth)return;const cols=2,rows=3,sw=wolf.naturalWidth/cols,sh=wolf.naturalHeight/rows,frame=((t/150+a.phase*8)|0)%6,sx=(frame%2)*sw,sy=Math.floor(frame/2)*sh;const scale=1.72*a.scale,laneY=H-54+a.lane*8,dw=sw*scale,dh=sh*scale;shadow(a.x,laneY,dw*.28);ctx.save();ctx.translate(a.x,laneY+1);if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(wolf,sx,sy,sw,sh,-dw/2,-dh+13,dw,dh);ctx.restore()}
function flightLaneY(seed,t){const top=Math.max(58,H*.18),bottom=Math.max(top+22,H*.44);return Math.max(top,Math.min(bottom,(top+bottom)/2+Math.sin(t*.001+seed)*18))}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);for(const a of actors){a.x+=a.dir*a.speed*dt;if(a.x<-100)a.dir=1;if(a.x>W+100)a.dir=-1;if(Math.random()<.0008)a.dir*=-1;drawWolf(a,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
