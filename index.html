<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;let W,H,D,last=performance.now();
const imgs={};function load(k,u){let i=new Image();i.crossOrigin='anonymous';i.src=u;imgs[k]=i}load('wolf','https://opengameart.org/sites/default/files/wolf%20walk.png');load('animals','https://opengameart.org/sites/default/files/enemies_081719_zp.png');load('viking','https://opengameart.org/sites/default/files/helgi.png');
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const types=['wolf','bear','boar','wolf','viking','wolf','bear'];const mobs=types.map((type,i)=>({type,x:(i+.5)*innerWidth/types.length,dir:i%2?1:-1,speed:13+Math.random()*10,p:Math.random()*10,rare:Math.random()<.07}));
const leaves=Array.from({length:18},()=>({x:Math.random()*innerWidth,s:9+Math.random()*18,p:Math.random()*8,z:2+Math.random()*3,c:Math.random()<.5?'#9a6337':'#bd7b3f'}));
function ground(t,dt){const y=H-42;let grad=g.createLinearGradient(0,y-70,0,H);grad.addColorStop(0,'rgba(4,14,22,0)');grad.addColorStop(1,'rgba(3,10,13,.68)');g.fillStyle=grad;g.fillRect(0,y-70,W,112);
// distant uneven bank
g.fillStyle='rgba(21,39,39,.50)';g.beginPath();g.moveTo(0,y+2);for(let x=0;x<=W;x+=45)g.lineTo(x,y-7-Math.sin(x*.017)*5);g.lineTo(W,H);g.lineTo(0,H);g.fill();
// detailed soil
g.fillStyle='rgba(42,54,43,.94)';g.fillRect(0,y,W,H-y);for(let x=5;x<W;x+=17){g.fillStyle=x%34?'rgba(76,79,59,.65)':'rgba(105,91,60,.55)';g.fillRect(x,y+8+(x%13),2+(x%4),2)}
// stones
g.fillStyle='rgba(73,76,72,.82)';for(let x=35;x<W;x+=127){g.fillRect(x,y+11,8+(x%7),4);g.fillStyle='rgba(103,106,99,.55)';g.fillRect(x+2,y+10,5,2);g.fillStyle='rgba(73,76,72,.82)'}
// waving grass
for(let x=3;x<W;x+=7){let sway=Math.sin(t*.0011+x*.09)*2.5;g.strokeStyle=x%21?'rgba(91,128,79,.72)':'rgba(132,158,101,.78)';g.lineWidth=1;g.beginPath();g.moveTo(x,y+2);g.lineTo(x+sway,y-5-(x%5));g.stroke()}
// rune stones
for(let x=95;x<W;x+=310){g.fillStyle='rgba(48,53,54,.92)';g.fillRect(x,y-13,10,16);g.fillStyle='rgba(76,179,218,.6)';g.fillRect(x+4,y-9,2,8);g.fillRect(x+2,y-7,6,2)}
// drifting leaves
for(const L of leaves){L.x+=L.s*dt;if(L.x>W+10)L.x=-10;let yy=y-1+Math.sin(t*.002+L.p)*7;g.save();g.translate(L.x,yy);g.rotate(Math.sin(t*.003+L.p));g.fillStyle=L.c;g.fillRect(-L.z/2,-1,L.z,2);g.restore()}
// larger lively fire
const fx=W*.52,fy=y+5,fl=Math.sin(t*.025)*5,fl2=Math.sin(t*.041+2)*4;g.fillStyle='rgba(83,49,29,.95)';g.save();g.translate(fx,fy);g.rotate(.22);g.fillRect(-19,5,38,5);g.rotate(-.44);g.fillRect(-19,5,38,5);g.restore();g.shadowColor='#ff7b22';g.shadowBlur=20;g.fillStyle='#e96824';g.beginPath();g.moveTo(fx-11,fy+5);g.lineTo(fx-5,fy-17-fl);g.lineTo(fx,fy-8);g.lineTo(fx+6,fy-26-fl2);g.lineTo(fx+12,fy+5);g.fill();g.fillStyle='#ffd36a';g.beginPath();g.moveTo(fx-5,fy+4);g.lineTo(fx,fy-13-fl2*.4);g.lineTo(fx+5,fy+4);g.fill();g.shadowBlur=0;for(let i=0;i<7;i++){let ey=fy-10-((t*.025+i*11)%31),ex=fx+Math.sin(t*.004+i*1.8)*11;g.fillStyle=i%2?'#ffb13b':'#e86a25';g.fillRect(ex,ey,2,2)}}
function drawMob(m,t){let hop=Math.abs(Math.sin(t*.006+m.p))*3,y=H-39-hop;g.save();g.translate(m.x,y);if(m.dir<0)g.scale(-1,1);if(m.rare){g.shadowColor='#72dcff';g.shadowBlur=15}
if(m.type==='wolf'&&imgs.wolf.complete){const im=imgs.wolf,fw=66,fh=66,cols=Math.max(1,Math.floor(im.width/fw)),frame=Math.floor(t/150+m.p)%Math.min(6,cols);g.drawImage(im,frame*fw,0,fw,fh,-72,-125,144,144)}
else if((m.type==='bear'||m.type==='boar')&&imgs.animals.complete){const im=imgs.animals;const cw=im.width/3,ch=im.height/4;const row=m.type==='bear'?2:1,frame=Math.floor(t/300+m.p)%3;g.drawImage(im,frame*cw,row*ch,cw,ch,-82,-118,164,112)}
else if(m.type==='viking'&&imgs.viking.complete){const im=imgs.viking;const sw=64,sh=64;let frame=Math.floor(t/220+m.p)%4;g.drawImage(im,frame*sw,64,sw,sh,-64,-125,128,128)}
g.restore();}
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;g.clearRect(0,0,W,H);ground(t,dt);for(const m of mobs){m.x+=m.dir*m.speed*dt;if(m.x<-90)m.dir=1;if(m.x>W+90)m.dir=-1;drawMob(m,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
