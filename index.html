<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaxnir's Midgard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
let W=0,H=0,D=1,last=performance.now();

const IMG={};
function load(k,u){const i=new Image();i.src=u;IMG[k]=i}
load('wolf','https://opengameart.org/sites/default/files/wolf%20walk.png');
load('stag','assets/realistic/stag.webp?v=1');
load('bear','assets/realistic/bear.webp?v=1');
load('ram','assets/realistic/ram.webp?v=1');
load('raven','assets/realistic/raven.webp?v=1');

const actors=[],leaves=[],stones=[],tufts=[];
function resize(){
  D=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  c.width=W*D; c.height=H*D; ctx.setTransform(D,0,0,D,0,0); ctx.imageSmoothingEnabled=false;
  if(!stones.length){
    for(let i=0;i<48;i++)stones.push({x:Math.random()*W,d:Math.random(),w:3+Math.random()*9,h:2+Math.random()*4});
    for(let i=0;i<40;i++)tufts.push({x:Math.random()*W,d:Math.random(),s:.65+Math.random()*.7,p:Math.random()*20});
  }
}
addEventListener('resize',resize); resize();

function add(kind,x,lane,dir,speed,scale=1){actors.push({kind,x,lane,dir,speed,scale,phase:Math.random()*1000,pause:0})}
add('wolf',W*.05,1,1,17,1);
add('stag',W*.25,0,1,10,.86);
add('bear',W*.44,2,-1,7,.86);
add('ram',W*.68,1,-1,10,.90);
add('wolf',W*.88,0,-1,15,.98);
add('raven',W*.16,2,1,11,.96);
add('raven',W*.79,1,-1,9,.90);

for(let i=0;i<30;i++)leaves.push({x:Math.random()*W,v:10+Math.random()*22,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.52?'#9b6338':'#6d472d'});

function grassPatch(x,y,t,s,p){
  ctx.lineWidth=1;
  for(let i=-8;i<=8;i+=4){
    const sw=Math.sin(t*.001+p+i*.22)*2.6*s;
    ctx.strokeStyle=i%8===0?'rgba(132,157,105,.78)':'rgba(72,108,73,.76)';
    ctx.beginPath();ctx.moveTo(x+i*s,y);ctx.lineTo(x+i*s+sw,y-(7+Math.abs(i%7))*s);ctx.stroke();
  }
}

function ground(t){
  const top=H-63,g=ctx.createLinearGradient(0,top-52,0,H);
  g.addColorStop(0,'rgba(3,9,15,0)'); g.addColorStop(.58,'rgba(5,14,18,.08)'); g.addColorStop(1,'rgba(2,7,9,.62)');
  ctx.fillStyle=g; ctx.fillRect(0,top-52,W,115);
  ctx.fillStyle='rgba(38,63,46,.95)';
  ctx.beginPath();ctx.moveTo(0,top+4);
  for(let x=0;x<=W;x+=14)ctx.lineTo(x,top+Math.sin(x*.03)*2);
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle='rgba(57,49,38,.92)';ctx.fillRect(0,H-43,W,43);
  ctx.fillStyle='rgba(77,65,48,.78)';ctx.fillRect(0,H-38,W,5);
  ctx.fillStyle='rgba(36,31,25,.42)';ctx.fillRect(0,H-17,W,17);

  for(const s of stones){
    const y=H-39+s.d*27;ctx.fillStyle='rgba(80,80,73,.72)';
    ctx.fillRect(Math.round(s.x),Math.round(y-s.h),Math.round(s.w),Math.round(s.h));
    ctx.fillStyle='rgba(136,131,114,.28)';
    ctx.fillRect(Math.round(s.x+1),Math.round(y-s.h),Math.max(1,Math.round(s.w*.5)),1);
  }
  for(const u of tufts)grassPatch(u.x,H-39+u.d*19,t,u.s,u.p);
  for(let x=2;x<W;x+=7){
    const sw=Math.sin(t*.001+x*.052)*2.5;
    ctx.strokeStyle=x%28===0?'rgba(139,163,109,.82)':'rgba(76,114,76,.72)';
    ctx.beginPath();ctx.moveTo(x,top+3);ctx.lineTo(x+sw,top-5-(x%6));ctx.stroke();
  }
}

function fire(t){
  const fx=W*.51,base=H-42;
  ctx.save();
  ctx.fillStyle='rgba(29,22,18,.75)';ctx.beginPath();ctx.ellipse(fx,base+17,45,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4c3021';
  ctx.save();ctx.translate(fx,base+10);ctx.rotate(.15);ctx.fillRect(-34,-4,68,8);ctx.restore();
  ctx.save();ctx.translate(fx,base+10);ctx.rotate(-.15);ctx.fillRect(-34,-4,68,8);ctx.restore();
  ctx.fillStyle='#805033';ctx.fillRect(fx-24,base+6,48,5);
  const f1=Math.sin(t*.027)*9,f2=Math.sin(t*.041+1.2)*7,f3=Math.sin(t*.019+2.4)*8;
  ctx.shadowColor='rgba(255,111,28,.96)';ctx.shadowBlur=29;
  ctx.fillStyle='rgba(220,65,19,.98)';ctx.beginPath();
  ctx.moveTo(fx-21,base+7);ctx.quadraticCurveTo(fx-16,base-25-f1,fx-6,base-42-f2);
  ctx.quadraticCurveTo(fx,base-17,fx+6,base-51-f3);ctx.quadraticCurveTo(fx+17,base-23,fx+22,base+7);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,142,29,.99)';ctx.beginPath();ctx.moveTo(fx-13,base+6);
  ctx.quadraticCurveTo(fx-6,base-26-f2*.7,fx+1,base-35-f1*.5);ctx.quadraticCurveTo(fx+7,base-12,fx+14,base+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,231,126,1)';ctx.beginPath();ctx.moveTo(fx-5,base+5);
  ctx.quadraticCurveTo(fx,base-15-f3*.4,fx+4,base-23);ctx.quadraticCurveTo(fx+8,base-8,fx+8,base+5);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  for(let i=0;i<14;i++){
    const ey=base-12-((t*.04+i*11)%52),ex=fx+Math.sin(t*.004+i*1.7)*22;
    ctx.globalAlpha=.28+((i%4)*.13);ctx.fillStyle=i%2?'#ffc052':'#ff6b24';
    ctx.fillRect(Math.round(ex),Math.round(ey),2+(i%2),2+(i%2));
  }
  ctx.restore();ctx.globalAlpha=1;
}

function moveLeaves(t,dt){
  const top=H-62;
  for(const l of leaves){
    l.x+=l.v*dt;
    const y=top+8+Math.sin(t*.0017+l.p)*10+Math.abs(Math.sin(t*.0008+l.p))*18;
    if(l.x>W+15){l.x=-15;l.p=Math.random()*20;l.v=10+Math.random()*22}
    ctx.save();ctx.translate(Math.round(l.x),Math.round(y));ctx.rotate(Math.sin(t*.0025+l.p)*1.05);
    ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.restore();
  }
}

function shadow(x,y,w,a=.32){
  ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(Math.round(x),Math.round(y),Math.round(w),5,0,0,Math.PI*2);ctx.fill();
}
function gy(a){return H-55+a.lane*7}

function drawWolf(a,t){
  const im=IMG.wolf;if(!im.complete||!im.naturalWidth)return;
  const sw=im.naturalWidth/2,sh=im.naturalHeight/3,fr=((t/150+a.phase)|0)%6;
  const sx=(fr%2)*sw,sy=Math.floor(fr/2)*sh,sc=1.72*a.scale,y=gy(a),dw=Math.round(sw*sc),dh=Math.round(sh*sc);
  shadow(a.x,y,dw*.28);
  ctx.save();ctx.translate(Math.round(a.x),Math.round(y+1));if(a.dir<0)ctx.scale(-1,1);
  ctx.drawImage(im,sx,sy,sw,sh,-Math.round(dw/2),-dh+13,dw,dh);ctx.restore();
}

const REAL={
  stag:{w:130,h:169,scale:.88,ground:8,shadow:.27},
  bear:{w:170,h:119,scale:.88,ground:8,shadow:.34},
  ram:{w:155,h:112,scale:.92,ground:8,shadow:.30},
  raven:{w:92,h:88,scale:.96,ground:7,shadow:.25}
};

function drawReal(a,t){
  const im=IMG[a.kind];if(!im||!im.complete||!im.naturalWidth)return;
  const m=REAL[a.kind], y=gy(a);
  const step=Math.sin(t*.0045+a.phase*.01);
  const isRaven=a.kind==='raven';
  const bob=isRaven ? Math.max(0,step)*2.2 : Math.abs(step)*.8;
  const dw=Math.round(m.w*m.scale*a.scale),dh=Math.round(m.h*m.scale*a.scale);
  shadow(a.x,y,dw*m.shadow,a.kind==='bear'?.38:.31);
  ctx.save();
  ctx.translate(Math.round(a.x),Math.round(y+bob));
  if(a.dir<0)ctx.scale(-1,1);
  ctx.drawImage(im,-Math.round(dw/2),-dh+m.ground,dw,dh);
  ctx.restore();
}

function draw(a,t){a.kind==='wolf'?drawWolf(a,t):drawReal(a,t)}

function loop(t){
  const dt=Math.min(.04,(t-last)/1000);last=t;
  ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);
  for(const a of actors){
    if(a.pause>0){a.pause-=dt}
    else{
      a.x+=a.dir*a.speed*dt;
      if(a.kind==='raven' && Math.random()<.0012)a.pause=.35+Math.random()*.7;
      if(a.kind==='stag' && Math.random()<.0007)a.pause=.6+Math.random()*1.2;
    }
    if(a.x<-150)a.dir=1;if(a.x>W+150)a.dir=-1;
    if(Math.random()<.00045)a.dir*=-1;
    draw(a,t);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
