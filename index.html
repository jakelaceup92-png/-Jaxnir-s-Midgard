<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;let W=0,H=0,D=1,last=performance.now();
const IMG={};function load(k,u){const i=new Image();i.src=u;IMG[k]=i}
load('wolf','https://opengameart.org/sites/default/files/wolf%20walk.png');
load('stag','sprites_v2/stag.svg');load('bear','sprites_v2/bear.svg');load('ram','sprites_v2/ram.svg');load('raven','sprites_v2/raven.svg');
const actors=[],leaves=[],stones=[],tufts=[];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;if(!stones.length){for(let i=0;i<52;i++)stones.push({x:Math.random()*W,d:Math.random(),w:3+Math.random()*9,h:2+Math.random()*4});for(let i=0;i<42;i++)tufts.push({x:Math.random()*W,d:Math.random(),s:.65+Math.random()*.65,p:Math.random()*20})}}
addEventListener('resize',resize);resize();
function add(kind,x,lane,dir,speed,scale=1){actors.push({kind,x,lane,dir,speed,scale,phase:Math.random()*100,turn:0})}
add('wolf',W*.05,0,1,17,1);add('stag',W*.24,1,1,12,1.02);add('bear',W*.43,2,-1,8,.98);add('ram',W*.68,1,-1,11,.96);add('wolf',W*.87,0,-1,15,.98);add('raven',W*.16,0,1,24,.96);add('raven',W*.78,0,-1,21,.90);
for(let i=0;i<30;i++)leaves.push({x:Math.random()*W,v:10+Math.random()*22,p:Math.random()*20,s:2+Math.random()*3,c:Math.random()<.52?'#9b6338':'#6d472d'});
function grassPatch(x,y,t,s,p){ctx.lineWidth=1;for(let i=-8;i<=8;i+=4){const sw=Math.sin(t*.001+p+i*.22)*2.7*s;ctx.strokeStyle=i%8===0?'rgba(132,157,105,.78)':'rgba(72,108,73,.76)';ctx.beginPath();ctx.moveTo(x+i*s,y);ctx.lineTo(x+i*s+sw,y-(7+Math.abs(i%7))*s);ctx.stroke()}}
function ground(t){const top=H-64,g=ctx.createLinearGradient(0,top-55,0,H);g.addColorStop(0,'rgba(3,9,15,0)');g.addColorStop(.55,'rgba(5,14,18,.07)');g.addColorStop(1,'rgba(2,7,9,.60)');ctx.fillStyle=g;ctx.fillRect(0,top-55,W,120);
ctx.fillStyle='rgba(18,34,36,.27)';ctx.beginPath();ctx.moveTo(0,top+5);for(let x=0;x<=W;x+=54)ctx.lineTo(x,top-10-Math.sin(x*.013+1.3)*4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.fillStyle='rgba(40,64,47,.94)';ctx.beginPath();ctx.moveTo(0,top+4);for(let x=0;x<=W;x+=14)ctx.lineTo(x,top+Math.sin(x*.03)*2);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.fillStyle='rgba(57,49,38,.91)';ctx.fillRect(0,H-44,W,44);ctx.fillStyle='rgba(76,64,47,.78)';ctx.fillRect(0,H-39,W,5);ctx.fillStyle='rgba(37,31,25,.38)';ctx.fillRect(0,H-17,W,17);
for(const s of stones){const y=H-40+s.d*28;ctx.fillStyle='rgba(79,79,72,.70)';ctx.fillRect(Math.round(s.x),Math.round(y-s.h),Math.round(s.w),Math.round(s.h));ctx.fillStyle='rgba(133,129,112,.30)';ctx.fillRect(Math.round(s.x+1),Math.round(y-s.h),Math.max(1,Math.round(s.w*.5)),1)}
for(const u of tufts)grassPatch(u.x,H-40+u.d*20,t,u.s,u.p);
for(let x=2;x<W;x+=7){const sw=Math.sin(t*.001+x*.052)*2.5;ctx.strokeStyle=x%28===0?'rgba(139,163,109,.82)':'rgba(76,114,76,.72)';ctx.beginPath();ctx.moveTo(x,top+3);ctx.lineTo(x+sw,top-5-(x%6));ctx.stroke()}}
function fire(t){const fx=W*.51,base=H-43;ctx.save();ctx.fillStyle='rgba(30,23,20,.75)';ctx.beginPath();ctx.ellipse(fx,base+18,45,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4c3021';ctx.save();ctx.translate(fx,base+11);ctx.rotate(.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.save();ctx.translate(fx,base+11);ctx.rotate(-.15);ctx.fillRect(-34,-4,68,8);ctx.restore();ctx.fillStyle='#805033';ctx.fillRect(fx-24,base+7,48,5);
const f1=Math.sin(t*.027)*9,f2=Math.sin(t*.041+1.2)*7,f3=Math.sin(t*.019+2.4)*8;ctx.shadowColor='rgba(255,111,28,.96)';ctx.shadowBlur=29;ctx.fillStyle='rgba(220,65,19,.98)';ctx.beginPath();ctx.moveTo(fx-21,base+7);ctx.quadraticCurveTo(fx-16,base-25-f1,fx-6,base-42-f2);ctx.quadraticCurveTo(fx,base-17,fx+6,base-51-f3);ctx.quadraticCurveTo(fx+17,base-23,fx+22,base+7);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,142,29,.99)';ctx.beginPath();ctx.moveTo(fx-13,base+6);ctx.quadraticCurveTo(fx-6,base-26-f2*.7,fx+1,base-35-f1*.5);ctx.quadraticCurveTo(fx+7,base-12,fx+14,base+6);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,231,126,1)';ctx.beginPath();ctx.moveTo(fx-5,base+5);ctx.quadraticCurveTo(fx,base-15-f3*.4,fx+4,base-23);ctx.quadraticCurveTo(fx+8,base-8,fx+8,base+5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;for(let i=0;i<14;i++){const ey=base-12-((t*.04+i*11)%52),ex=fx+Math.sin(t*.004+i*1.7)*22;ctx.globalAlpha=.28+((i%4)*.13);ctx.fillStyle=i%2?'#ffc052':'#ff6b24';ctx.fillRect(Math.round(ex),Math.round(ey),2+(i%2),2+(i%2))}ctx.restore();ctx.globalAlpha=1}
function moveLeaves(t,dt){const top=H-63;for(const l of leaves){l.x+=l.v*dt;const y=top+8+Math.sin(t*.0017+l.p)*10+Math.abs(Math.sin(t*.0008+l.p))*18;if(l.x>W+15){l.x=-15;l.p=Math.random()*20;l.v=10+Math.random()*22}ctx.save();ctx.translate(Math.round(l.x),Math.round(y));ctx.rotate(Math.sin(t*.0025+l.p)*1.05);ctx.fillStyle=l.c;ctx.fillRect(-l.s/2,-1,l.s,2);ctx.restore()}}
function shadow(x,y,w,a=.33){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.beginPath();ctx.ellipse(Math.round(x),Math.round(y),Math.round(w),5,0,0,Math.PI*2);ctx.fill()}
function gy(a){return H-56+a.lane*8}
function drawWolf(a,t){const im=IMG.wolf;if(!im.complete||!im.naturalWidth)return;const sw=im.naturalWidth/2,sh=im.naturalHeight/3,fr=((t/150+a.phase)|0)%6,sx=(fr%2)*sw,sy=Math.floor(fr/2)*sh,sc=1.72*a.scale,y=gy(a),dw=Math.round(sw*sc),dh=Math.round(sh*sc);shadow(a.x,y,dw*.28);ctx.save();ctx.translate(Math.round(a.x),Math.round(y+1));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,sx,sy,sw,sh,-Math.round(dw/2),-dh+13,dw,dh);ctx.restore()}
function drawGroundSheet(a,t,key,frameW,frameH,scale,speedMs,yOffset){const im=IMG[key];if(!im.complete||!im.naturalWidth)return;const fr=((t/speedMs+a.phase)|0)%3,y=gy(a),dw=Math.round(frameW*scale*a.scale),dh=Math.round(frameH*scale*a.scale),bob=(fr===1?1:0);shadow(a.x,y,dw*.29,key==='bear'?.38:.32);ctx.save();ctx.translate(Math.round(a.x),Math.round(y+bob));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,fr*frameW,0,frameW,frameH,-Math.round(dw/2),-dh+yOffset,dw,dh);ctx.restore()}
function flightY(a,t){const half=35*a.scale,top=half+8,bottom=Math.max(top+12,H-105);const mid=(top+bottom)/2;return Math.max(top,Math.min(bottom,mid+Math.sin(t*.00125+a.phase)*10))}
function drawRaven(a,t){const im=IMG.raven;if(!im.complete||!im.naturalWidth)return;const fr=((t/145+a.phase)|0)%3,fw=80,fh=64,sc=1.03*a.scale,dw=Math.round(fw*sc),dh=Math.round(fh*sc),y=flightY(a,t);ctx.save();ctx.translate(Math.round(a.x),Math.round(y));if(a.dir<0)ctx.scale(-1,1);ctx.drawImage(im,fr*fw,0,fw,fh,-Math.round(dw/2),-Math.round(dh/2),dw,dh);ctx.restore()}
function draw(a,t){if(a.kind==='wolf')drawWolf(a,t);else if(a.kind==='stag')drawGroundSheet(a,t,'stag',96,72,1.03,185,7);else if(a.kind==='bear')drawGroundSheet(a,t,'bear',96,72,1.02,220,7);else if(a.kind==='ram')drawGroundSheet(a,t,'ram',96,72,.98,190,7);else drawRaven(a,t)}
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);ground(t);moveLeaves(t,dt);fire(t);for(const a of actors){a.x+=a.dir*a.speed*dt;if(a.x<-135)a.dir=1;if(a.x>W+135)a.dir=-1;if(Math.random()<.00055)a.dir*=-1;draw(a,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
