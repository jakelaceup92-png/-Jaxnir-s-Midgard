<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaxnir's Midgard</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0,D=1,last=performance.now();const TYPES=['wolf','bear','raven','boar','stag','dwarf','troll','dragon'];const A=[];function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function make(i){return{type:TYPES[i%TYPES.length],x:Math.random()*W,dir:Math.random()<.5?-1:1,speed:18+Math.random()*20,phase:Math.random()*20,rare:Math.random()<.05,mode:'walk',modeT:1+Math.random()*3}}for(let i=0;i<8;i++)A.push(make(i));function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(x1,y1,x2,y2,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function bg(t){const ground=H-42;const glow=ctx.createLinearGradient(0,ground-62,0,H);glow.addColorStop(0,'rgba(5,18,28,0)');glow.addColorStop(.5,'rgba(5,18,28,.16)');glow.addColorStop(1,'rgba(3,12,18,.58)');ctx.fillStyle=glow;ctx.fillRect(0,ground-62,W,104);ctx.fillStyle='rgba(20,38,46,.34)';ctx.beginPath();ctx.moveTo(0,ground+2);for(let x=0;x<=W;x+=90){ctx.lineTo(x,ground-15-Math.sin(x*.012+1.2)*6)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(34,61,52,.88)';ctx.beginPath();ctx.moveTo(0,ground+2);for(let x=0;x<=W;x+=35){ctx.lineTo(x,ground+Math.sin(x*.02)*2)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(73,76,77,.72)';ctx.beginPath();ctx.moveTo(0,H-18);for(let x=0;x<=W;x+=42){ctx.lineTo(x,H-20+Math.sin(x*.027)*1.5)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();for(let x=75;x<W;x+=215){const y=H-26;ctx.fillStyle='rgba(43,48,50,.9)';ctx.beginPath();ctx.roundRect(x,y-20,14,20,3);ctx.fill();ctx.strokeStyle='rgba(93,195,232,.52)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+4,y-15);ctx.lineTo(x+10,y-10);ctx.lineTo(x+5,y-5);ctx.stroke()}for(let x=28;x<W;x+=130){ctx.fillStyle='rgba(133,157,121,.55)';ctx.fillRect(x,H-25,2,7);ctx.fillRect(x+4,H-23,2,5)}if(W>500){const fx=W*.52,fy=H-28;line(fx-10,fy+4,fx+10,fy+4,5,'rgba(88,53,35,.9)');ellipse(fx,fy-2,7,10,'rgba(245,161,61,.76)');ellipse(fx,fy,4,7,'rgba(255,217,116,.85)')}}function drawAnimal(v,t){const baseY=H-39;const dancing=v.mode==='dance';const hop=(dancing?Math.abs(Math.sin(t*.014+v.phase))*12:Math.abs(Math.sin(t*.006+v.phase))*3);const sway=dancing?Math.sin(t*.018+v.phase)*5:0;const scale=v.rare?3.35:3;ctx.save();ctx.translate(v.x+sway,baseY-hop);if(v.dir<0)ctx.scale(-1,1);ctx.scale(scale,scale);if(v.rare){ctx.shadowColor='rgba(94,205,255,.95)';ctx.shadowBlur=7}const type=v.type;let fur='#8e9ba2';if(type==='bear')fur='#6c5143';if(type==='raven')fur='#232936';if(type==='boar')fur='#745246';if(type==='stag')fur='#907053';if(type==='troll')fur='#6f8870';if(type==='dragon')fur='#4f806e';if(type==='dwarf')fur='#92715e';ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,2,15,3,0,0,Math.PI*2);ctx.fill();if(type==='raven'){ctx.fillStyle=fur;ctx.beginPath();ctx.ellipse(-1,-9,8,6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,-14,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9ab57';ctx.beginPath();ctx.moveTo(11,-14);ctx.lineTo(17,-12);ctx.lineTo(11,-10);ctx.fill();ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(-15,-18);ctx.lineTo(-10,-5);ctx.fill();line(-2,-4,-2,1,1.5,'#6e747b');line(4,-4,4,1,1.5,'#6e747b')}else if(type==='dwarf'){ctx.fillStyle='#725746';ctx.fillRect(-7,-16,14,13);ellipse(0,-20,6,6,'#d0a17f');ctx.fillStyle='#7f4935';ctx.beginPath();ctx.moveTo(-5,-18);ctx.lineTo(5,-18);ctx.lineTo(0,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#6c7780';ctx.fillRect(-9,-3,6,4);ctx.fillRect(3,-3,6,4);line(8,-13,14,-5,2,'#9da8ae');line(13,-14,13,-4,2,'#8b5a36');ctx.fillStyle='#4d5961';ctx.fillRect(-8,-16,16,4)}else if(type==='troll'){ellipse(0,-11,10,12,fur);ellipse(0,-23,8,7,fur);line(-10,-12,-16,-3,3,fur);line(10,-12,16,-3,3,fur);line(-5,0,-7,4,4,'#384640');line(5,0,7,4,4,'#384640');ctx.fillStyle='#d7e0d9';ctx.fillRect(-4,-24,2,2);ctx.fillRect(3,-24,2,2)}else if(type==='dragon'){ellipse(-3,-10,12,7,fur);ellipse(9,-16,7,6,fur);ctx.fillStyle=fur;ctx.beginPath();ctx.moveTo(-8,-14);ctx.lineTo(-16,-27);ctx.lineTo(-4,-17);ctx.fill();ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(8,-28);ctx.lineTo(6,-16);ctx.fill();line(-9,-5,-10,1,3,fur);line(5,-5,6,1,3,fur);ctx.fillStyle='#d7eff6';ctx.fillRect(12,-17,2,2)}else{ellipse(-2,-10,type==='bear'?12:11,type==='bear'?8:7,fur);ellipse(9,-14,type==='bear'?7:6,type==='bear'?6:5,fur);line(-8,-4,-9,1,type==='bear'?4:3,fur);line(5,-4,5,1,type==='bear'?4:3,fur);if(type==='wolf'){ctx.beginPath();ctx.moveTo(6,-18);ctx.lineTo(8,-25);ctx.lineTo(11,-18);ctx.fill();ctx.beginPath();ctx.moveTo(11,-18);ctx.lineTo(15,-24);ctx.lineTo(15,-16);ctx.fill();line(-12,-11,-18,-7,3,fur);ctx.fillStyle='#dcebf1';ctx.fillRect(12,-15,1.5,1.5)}if(type==='bear'){ctx.beginPath();ctx.arc(6,-20,3,0,Math.PI*2);ctx.arc(12,-20,3,0,Math.PI*2);ctx.fill()}if(type==='boar'){ctx.fillStyle='#e7d7bd';ctx.beginPath();ctx.moveTo(14,-13);ctx.lineTo(20,-12);ctx.lineTo(14,-10);ctx.fill()}if(type==='stag'){line(10,-20,10,-29,1.5,'#c4a476');line(14,-20,15,-29,1.5,'#c4a476');line(10,-27,6,-30,1.2,'#c4a476');line(15,-27,19,-30,1.2,'#c4a476')}}ctx.restore()}function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;ctx.clearRect(0,0,W,H);bg(t);for(const v of A){v.modeT-=dt;if(v.modeT<=0){v.mode=Math.random()<.3?'dance':'walk';v.modeT=.8+Math.random()*2.6}if(v.mode==='walk'){v.x+=v.dir*v.speed*dt;if(v.x<-65)v.dir=1;if(v.x>W+65)v.dir=-1;if(Math.random()<.0015)v.dir*=-1}drawAnimal(v,t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
