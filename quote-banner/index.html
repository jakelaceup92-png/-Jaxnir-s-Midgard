<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jaxnir Quote Banner</title>
  <style>
    :root {
      --black: #020203;
      --charcoal: #0a0a0d;
      --gunmetal: #4c4c52;
      --silver: #ddd9d3;
      --bone: #f1ece3;
      --crimson: #8d0a10;
      --crimson-bright: #c11921;
      --transition-ms: 600ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Georgia, "Palatino Linotype", "Book Antiqua", serif;
    }

    .banner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: clamp(54px, 8.5%, 142px) minmax(0, 1fr);
      align-items: center;
      isolation: isolate;
      overflow: hidden;
      color: var(--bone);
      background:
        linear-gradient(90deg, rgba(66, 5, 9, 0.28), transparent 15%, transparent 82%, rgba(56, 5, 8, 0.18)),
        linear-gradient(180deg, rgba(25, 25, 29, 0.98), rgba(3, 3, 5, 0.99) 52%, rgba(15, 15, 18, 0.98));
      clip-path: polygon(1.1% 0, 98.9% 0, 100% 22%, 100% 78%, 98.9% 100%, 1.1% 100%, 0 78%, 0 22%);
      box-shadow:
        inset 0 0 0 1px rgba(192, 190, 188, 0.42),
        inset 0 0 0 3px rgba(0, 0, 0, 0.9),
        inset 0 0 0 4px rgba(126, 8, 14, 0.48),
        inset 0 0 34px rgba(0, 0, 0, 0.96);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: -16%;
      z-index: -2;
      pointer-events: none;
      opacity: 0.38;
      background:
        radial-gradient(ellipse at 16% 25%, rgba(114, 12, 18, 0.18), transparent 28%),
        radial-gradient(ellipse at 52% 80%, rgba(110, 110, 116, 0.08), transparent 34%),
        radial-gradient(ellipse at 82% 20%, rgba(90, 90, 96, 0.06), transparent 30%),
        radial-gradient(ellipse at 75% 70%, rgba(91, 7, 12, 0.12), transparent 32%);
      filter: blur(9px);
      animation: smoke-drift 32s ease-in-out infinite alternate;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: 4;
      pointer-events: none;
      border: 1px solid rgba(128, 9, 15, 0.36);
      clip-path: polygon(1% 0, 99% 0, 100% 25%, 100% 75%, 99% 100%, 1% 100%, 0 75%, 0 25%);
    }

    .icon-cell {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .icon-cell::after {
      content: "";
      position: absolute;
      top: 19%;
      right: 0;
      bottom: 19%;
      width: 1px;
      background: linear-gradient(transparent, rgba(154, 20, 27, 0.7), transparent);
      box-shadow: 1px 0 0 rgba(218, 214, 207, 0.08);
    }

    .eclipse {
      position: relative;
      width: min(62%, 78px);
      max-height: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 30%, rgba(92, 19, 23, 0.45), transparent 20%),
        radial-gradient(circle at 56% 53%, #050506 0 49%, #1e0305 65%, #070708 76%);
      border: 1px solid rgba(192, 186, 179, 0.38);
      box-shadow:
        inset -4px 1px 7px rgba(201, 25, 33, 0.8),
        -1px 0 5px rgba(226, 41, 48, 0.38),
        0 0 14px rgba(129, 8, 14, 0.33);
      animation: eclipse-pulse 7.5s ease-in-out infinite;
    }

    .eclipse::before {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 33%, #151519, #030304 66%);
      box-shadow: inset -2px 0 3px rgba(114, 8, 13, 0.72);
    }

    .quote-cell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      place-items: center;
      padding: clamp(6px, 1.5vmin, 20px) clamp(18px, 2.5vw, 58px) clamp(6px, 1.5vmin, 20px) clamp(14px, 2vw, 44px);
      overflow: hidden;
    }

    .quote {
      width: 100%;
      max-height: 100%;
      margin: 0;
      color: var(--bone);
      font-weight: 600;
      line-height: 1.13;
      letter-spacing: 0.075em;
      text-align: center;
      text-wrap: balance;
      overflow: hidden;
      opacity: 1;
      transform: translateY(0);
      text-shadow:
        0 2px 1px rgba(0, 0, 0, 0.92),
        0 0 8px rgba(115, 6, 11, 0.28);
      transition:
        opacity var(--transition-ms) ease,
        transform var(--transition-ms) ease;
      will-change: opacity, transform;
    }

    .quote.is-exiting {
      opacity: 0;
      transform: translateY(-8px);
    }

    .quote.is-entering {
      opacity: 0;
      transform: translateY(8px);
      transition: none;
    }

    .sweep {
      position: absolute;
      left: -34%;
      z-index: 5;
      width: 30%;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(109, 8, 14, 0.28), rgba(222, 56, 63, 0.78), rgba(109, 8, 14, 0.28), transparent);
      filter: drop-shadow(0 0 3px rgba(144, 10, 17, 0.44));
      animation: border-sweep 12s linear infinite;
    }

    .sweep-top {
      top: 2px;
    }

    .sweep-bottom {
      bottom: 2px;
      animation-delay: -0.28s;
    }

    @keyframes border-sweep {
      0%, 70% {
        left: -34%;
        opacity: 0;
      }
      73% {
        opacity: 0.82;
      }
      88% {
        left: 104%;
        opacity: 0.82;
      }
      91%, 100% {
        left: 104%;
        opacity: 0;
      }
    }

    @keyframes eclipse-pulse {
      0%, 100% {
        filter: brightness(0.9);
        transform: scale(0.985);
      }
      50% {
        filter: brightness(1.08);
        transform: scale(1.015);
      }
    }

    @keyframes smoke-drift {
      from {
        transform: translate3d(-1.5%, -1%, 0) scale(1.02);
      }
      to {
        transform: translate3d(1.5%, 1%, 0) scale(1.07);
      }
    }

    @media (max-aspect-ratio: 4 / 1) {
      .banner {
        grid-template-columns: clamp(48px, 10%, 118px) minmax(0, 1fr);
      }

      .quote-cell {
        padding-inline: clamp(12px, 2.1vw, 34px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner::before,
      .eclipse,
      .sweep {
        animation: none !important;
      }

      .quote {
        transform: none !important;
        transition: opacity var(--transition-ms) linear;
      }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Jaxnir rotating message banner">
    <div class="icon-cell" aria-hidden="true">
      <div class="eclipse"></div>
    </div>
    <div class="quote-cell">
      <p id="quote" class="quote" aria-live="polite"></p>
    </div>
    <div class="sweep sweep-top" aria-hidden="true"></div>
    <div class="sweep sweep-bottom" aria-hidden="true"></div>
  </main>

  <script>
    "use strict";

    const quotes = [
      "Believe you can, and you're halfway there.",
      "The best way out is always through.",
      "Well done is better than well said.",
      "No act of kindness is ever wasted.",
      "Fortune favors the bold.",
      "Fall seven times, stand up eight.",
      "A journey of a thousand miles begins with one step.",
      "Wherever you go, go with all your heart.",
      "What you do makes a difference.",
      "Nothing great was ever achieved without enthusiasm.",
      "Great things are done by a series of small things.",
      "Hope is a waking dream.",
      "Light tomorrow with today.",
      "Make each day your masterpiece.",
      "Nothing will work unless you do.",
      "The harder the conflict, the greater the triumph.",
      "Happiness depends upon ourselves.",
      "The only limit is the one you accept.",
      "Action turns possibility into progress.",
      "Courage begins when comfort ends.",
      "Progress beats perfection.",
      "Small steps still count.",
      "Your pace is still progress.",
      "One more try can change everything.",
      "Today's effort becomes tomorrow's strength.",
      "Begin before you feel ready.",
      "Consistency turns effort into results.",
      "Your comeback can start right now.",
      "A bad chapter is not the whole story.",
      "Keep building, even when no one is watching.",
      "Hard days do not erase your progress.",
      "Momentum begins with one honest step.",
      "You are allowed to grow at your own pace.",
      "Choose progress over pressure.",
      "Do the next right thing.",
      "Keep showing up for yourself.",
      "Be proud of how far you have come.",
      "The strongest version of you is still being built.",
      "Your effort matters more than your mood.",
      "Patience is part of the process.",
      "Let courage speak louder than doubt.",
      "Start where you are.",
      "Every sunrise is another chance.",
      "Make today count.",
      "Better days are built, not found.",
      "The obstacle can become the way.",
      "Keep your standards high and your spirit higher.",
      "Slow progress is still a victory.",
      "You can begin again at any moment.",
      "Believe in the work you are doing.",
      "Your story is still unfolding.",
      "One step forward changes the view.",
      "Growth feels uncomfortable before it feels powerful.",
      "Give yourself credit for staying in the fight.",
      "Your direction matters more than your speed.",
      "Be stronger than your strongest excuse.",
      "Quiet consistency creates loud results.",
      "You were not made to stay stuck.",
      "Do not quit before the breakthrough.",
      "Today's discipline is tomorrow's freedom.",
      "Turn pressure into purpose.",
      "Confidence grows through action.",
      "Make room for the life you are building.",
      "Even the darkest night ends with dawn.",
      "Storms make roots grow deeper.",
      "Choose hope, especially when it is hard.",
      "You are closer than you think.",
      "Keep moving through the uncertainty.",
      "Your next chapter deserves your courage.",
      "Strength is built one choice at a time.",
      "Every setback teaches the next step.",
      "Keep the faith and keep the pace.",
      "Your potential is waiting on your persistence.",
      "Do not let fear write your ending.",
      "Be patient with the person you are becoming.",
      "Your limits are not always where you think.",
      "Nothing changes if nothing changes.",
      "Make the hard choice your future will thank you for.",
      "The climb is proof that you are moving.",
      "You are capable of more than this moment suggests.",
      "Protect your peace and pursue your purpose.",
      "Your habits are shaping your future.",
      "Show up tired. Show up uncertain. Just show up.",
      "Never underestimate the power of another attempt.",
      "Build a life you do not need to escape from.",
      "Let the past teach you, not trap you.",
      "Dream boldly. Move deliberately.",
      "You do not need permission to improve your life.",
      "The version of you who kept going wins.",
      "Success begins with refusing to quit.",
      "Turn intention into action.",
      "Your struggle is not your identity.",
      "Stay humble, stay hungry, stay moving.",
      "Strong minds are built in hard seasons.",
      "Do not wait for motivation. Build momentum.",
      "Keep the promise you made to yourself.",
      "Every day is a chance to reset.",
      "Your future is worth today's effort.",
      "Keep going until your doubt gets tired.",
      "Today is another chance to become more."
    ];

    const supportMessages = [
      "Enjoying the stream? Follow Jaxnir and join the community.",
      "Have Prime? Use your Prime Gaming sub to support Jaxnir.",
      "Thank you for being here. Your support keeps the stream going.",
      "Jaxnir proudly supports Extra Life.",
      "Follow, subscribe, and help our community support Extra Life.",
      "Thank you for supporting Jaxnir and Extra Life."
    ];

    const socialMessages = [
      "TWITCH  •  twitch.tv/Jaxnir",
      "YOUTUBE  •  youtube.com/@Jaxnir",
      "TIKTOK  •  @Jaxnir",
      "DISCORD  •  Join through the link below the stream"
    ];

    const query = new URLSearchParams(window.location.search);
    const testMode = query.has("test");
    const DISPLAY_MS = testMode ? 900 : 9000;
    const TRANSITION_MS = testMode ? 120 : 600;
    const QUOTES_PER_CALLOUT = 2;

    const quoteElement = document.getElementById("quote");
    const quoteCell = document.querySelector(".quote-cell");

    let quoteDeck = [];
    let deckIndex = 0;
    let supportIndex = 0;
    let socialIndex = 0;
    let calloutTurn = 0;
    let quotesSinceCallout = 0;
    let currentMessage = "";
    let timerId = null;
    let resizeFrame = null;

    function shuffle(source) {
      const output = [...source];
      for (let i = output.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [output[i], output[j]] = [output[j], output[i]];
      }
      return output;
    }

    function refillDeck() {
      quoteDeck = shuffle(quotes);
      if (quoteDeck.length > 1 && quoteDeck[0] === currentMessage) {
        [quoteDeck[0], quoteDeck[1]] = [quoteDeck[1], quoteDeck[0]];
      }
      deckIndex = 0;
    }

    function nextQuote() {
      if (deckIndex >= quoteDeck.length) {
        refillDeck();
      }
      return quoteDeck[deckIndex++];
    }

    function nextMessage() {
      if (quotesSinceCallout >= QUOTES_PER_CALLOUT) {
        quotesSinceCallout = 0;
        const showSupport = calloutTurn % 2 === 0;
        calloutTurn += 1;

        if (showSupport) {
          const message = supportMessages[supportIndex % supportMessages.length];
          supportIndex += 1;
          return message;
        }

        const message = socialMessages[socialIndex % socialMessages.length];
        socialIndex += 1;
        return message;
      }
      quotesSinceCallout += 1;
      return nextQuote();
    }

    function clearTimer() {
      if (timerId !== null) {
        window.clearTimeout(timerId);
        timerId = null;
      }
    }

    function schedule(callback, delay) {
      clearTimer();
      timerId = window.setTimeout(callback, delay);
    }

    function fitText() {
      if (!quoteElement.textContent || quoteCell.clientWidth === 0 || quoteCell.clientHeight === 0) {
        return;
      }

      const minimum = 10;
      let low = minimum;
      let high = Math.max(minimum, Math.min(150, quoteCell.clientHeight * 0.62, quoteCell.clientWidth / 11));
      let best = minimum;

      for (let pass = 0; pass < 11; pass += 1) {
        const size = (low + high) / 2;
        quoteElement.style.fontSize = `${size}px`;
        quoteElement.style.letterSpacing = `${Math.max(0.55, size * 0.075)}px`;

        const lineHeight = size * 1.13;
        const lineCount = Math.ceil(quoteElement.scrollHeight / lineHeight - 0.02);
        const fits = quoteElement.scrollHeight <= quoteCell.clientHeight - 4
          && quoteElement.scrollWidth <= quoteCell.clientWidth
          && lineCount <= 2;

        if (fits) {
          best = size;
          low = size;
        } else {
          high = size;
        }
      }

      quoteElement.style.fontSize = `${best}px`;
      quoteElement.style.letterSpacing = `${Math.max(0.55, best * 0.075)}px`;
    }

    function requestFit() {
      if (resizeFrame !== null) {
        cancelAnimationFrame(resizeFrame);
      }
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        fitText();
      });
    }

    function settleEntry() {
      quoteElement.classList.remove("is-entering");
      schedule(beginExit, DISPLAY_MS);
    }

    function replaceMessage() {
      currentMessage = nextMessage();
      quoteElement.textContent = currentMessage;
      quoteElement.classList.remove("is-exiting");
      quoteElement.classList.add("is-entering");
      fitText();
      void quoteElement.offsetWidth;
      requestAnimationFrame(settleEntry);
    }

    function beginExit() {
      quoteElement.classList.add("is-exiting");
      schedule(replaceMessage, TRANSITION_MS);
    }

    function start() {
      clearTimer();
      refillDeck();
      currentMessage = nextMessage();
      quoteElement.textContent = currentMessage;
      quoteElement.classList.remove("is-exiting", "is-entering");
      fitText();
      schedule(beginExit, DISPLAY_MS);
    }

    const resizeObserver = new ResizeObserver(requestFit);
    resizeObserver.observe(quoteCell);

    document.addEventListener("visibilitychange", () => {
      clearTimer();
      quoteElement.classList.remove("is-exiting", "is-entering");
      if (!document.hidden) {
        fitText();
        schedule(beginExit, DISPLAY_MS);
      }
    });

    window.addEventListener("pagehide", clearTimer, { once: true });

    window.__jaxnirBanner = {
      quoteCount: quotes.length,
      supportMessageCount: supportMessages.length,
      socialMessageCount: socialMessages.length,
      quotesPerCallout: QUOTES_PER_CALLOUT,
      getCurrentMessage: () => currentMessage,
      getTimerActive: () => timerId !== null,
      fitText,
      next: beginExit
    };

    start();
  </script>
</body>
</html>
