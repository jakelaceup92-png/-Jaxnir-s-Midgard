<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jaxnir Quote Banner</title>
  <style>
    :root {
      --ink: #02060b;
      --navy: #06111d;
      --deep-blue: #071a2d;
      --electric: #27aaff;
      --electric-bright: #83dcff;
      --ice: #eef9ff;
      --transition-ms: 600ms;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: "Cinzel", "Copperplate Gothic Bold", "Copperplate", "Trajan Pro", "Constantia", "Palatino Linotype", Georgia, serif;
    }

    .banner {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      width: 100%;
      height: clamp(160px, 24vh, 260px);
      max-height: 100%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      color: var(--ice);
      border: clamp(1px, 0.18vmin, 3px) solid rgba(50, 172, 255, 0.92);
      border-radius: 0;
      background:
        linear-gradient(90deg, rgba(12, 49, 82, 0.68), transparent 17%, transparent 83%, rgba(12, 49, 82, 0.68)),
        linear-gradient(180deg, rgba(11, 27, 45, 0.98), rgba(2, 7, 13, 0.99) 52%, rgba(5, 18, 31, 0.98));
      box-shadow:
        inset 0 0 0 1px rgba(192, 232, 255, 0.3),
        inset 0 0 18px rgba(34, 158, 238, 0.28),
        inset 0 0 48px rgba(0, 54, 98, 0.28);
      animation: border-glow 4.8s ease-in-out infinite;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: -22%;
      z-index: -2;
      pointer-events: none;
      opacity: 0.62;
      background:
        radial-gradient(ellipse at 18% 30%, rgba(25, 145, 225, 0.22), transparent 27%),
        radial-gradient(ellipse at 52% 76%, rgba(15, 92, 162, 0.18), transparent 36%),
        radial-gradient(ellipse at 84% 22%, rgba(65, 176, 240, 0.12), transparent 30%),
        radial-gradient(ellipse at 76% 74%, rgba(0, 80, 150, 0.15), transparent 32%);
      filter: blur(13px);
      animation: blue-drift 28s ease-in-out infinite alternate;
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: clamp(3px, 0.42vmin, 7px);
      z-index: 5;
      pointer-events: none;
      border: 1px solid rgba(91, 193, 255, 0.3);
      border-radius: 0;
      box-shadow:
        inset 0 0 10px rgba(29, 158, 239, 0.16),
        0 0 8px rgba(39, 170, 255, 0.12);
    }

    .rune-field {
      position: absolute;
      inset: 7% 12%;
      z-index: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      overflow: hidden;
    }

    .rune-mark {
      height: 105%;
      width: min(28%, 360px);
      min-width: 105px;
      overflow: visible;
      opacity: 0.2;
      filter:
        drop-shadow(0 0 4px rgba(84, 199, 255, 0.92))
        drop-shadow(0 0 13px rgba(23, 145, 234, 0.82))
        drop-shadow(0 0 28px rgba(0, 88, 180, 0.52));
      animation: rune-breathe 6.6s ease-in-out infinite;
    }

    .rune-mark path,
    .rune-mark polygon {
      fill: none;
      stroke: url(#runeGradient);
      stroke-width: 6;
      stroke-linecap: square;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    .rune-core {
      stroke-width: 8 !important;
    }

    .quote-cell {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      min-width: 0;
      display: grid;
      place-items: center;
      padding: clamp(7px, 1.5vmin, 20px) clamp(22px, 4vw, 90px);
      overflow: hidden;
    }

    .quote {
      width: 100%;
      max-height: 100%;
      margin: 0;
      color: #f4fbff;
      font-family: "Cinzel", "Copperplate Gothic Bold", "Copperplate", "Trajan Pro", "Constantia", "Palatino Linotype", Georgia, serif;
      font-weight: 700;
      font-variant-caps: small-caps;
      font-feature-settings: "kern" 1;
      line-height: 1.1;
      letter-spacing: 0.085em;
      text-align: center;
      text-wrap: balance;
      overflow: hidden;
      opacity: 1;
      transform: translateY(0);
      text-shadow:
        0 1px 0 rgba(224, 246, 255, 0.78),
        0 2px 0 rgba(22, 70, 105, 0.88),
        0 3px 2px rgba(0, 0, 0, 0.9),
        0 0 8px rgba(91, 201, 255, 0.46),
        0 0 20px rgba(10, 102, 180, 0.28);
      transition:
        opacity var(--transition-ms) ease,
        transform var(--transition-ms) ease;
      will-change: opacity, transform;
    }


    .message-emoji {
      display: inline-block;
      margin-right: 0.4em;
      color: initial;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-size: 0.72em;
      font-style: normal;
      font-variant: normal;
      font-weight: 400;
      line-height: 1;
      vertical-align: 0.08em;
      text-shadow: none;
      filter:
        drop-shadow(0 0 3px rgba(212, 246, 255, 0.9))
        drop-shadow(0 0 8px rgba(49, 179, 255, 0.6));
      animation: emoji-float 3.6s ease-in-out infinite;
    }

    .message-copy {
      display: inline;
    }

    .quote.is-exiting {
      opacity: 0;
      transform: translateY(-8px);
    }

    .quote.is-entering {
      opacity: 0;
      transform: translateY(8px);
      transition: none;
    }

    .perimeter-light {
      position: absolute;
      z-index: 7;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(42, 170, 255, 0.45),
        rgba(193, 241, 255, 1),
        rgba(42, 170, 255, 0.45),
        transparent
      );
      box-shadow:
        0 0 4px rgba(182, 239, 255, 1),
        0 0 10px rgba(53, 185, 255, 0.96),
        0 0 20px rgba(0, 116, 231, 0.72);
      will-change: left, right, top, bottom, opacity;
    }

    .perimeter-top,
    .perimeter-bottom {
      width: clamp(72px, 14%, 260px);
      height: clamp(2px, 0.2vmin, 4px);
    }

    .perimeter-right,
    .perimeter-left {
      width: clamp(2px, 0.2vmin, 4px);
      height: clamp(42px, 20%, 170px);
      background: linear-gradient(
        180deg,
        transparent,
        rgba(42, 170, 255, 0.45),
        rgba(193, 241, 255, 1),
        rgba(42, 170, 255, 0.45),
        transparent
      );
    }

    .perimeter-top {
      top: 0;
      left: -16%;
      animation: run-top 10s linear infinite;
    }

    .perimeter-right {
      top: -22%;
      right: 0;
      animation: run-right 10s linear infinite;
    }

    .perimeter-bottom {
      right: -16%;
      bottom: 0;
      animation: run-bottom 10s linear infinite;
    }

    .perimeter-left {
      bottom: -22%;
      left: 0;
      animation: run-left 10s linear infinite;
    }

    @keyframes run-top {
      0% {
        left: -16%;
        opacity: 0;
      }
      1.5% {
        opacity: 1;
      }
      23.5% {
        left: 100%;
        opacity: 1;
      }
      25%, 100% {
        left: 100%;
        opacity: 0;
      }
    }

    @keyframes run-right {
      0%, 24% {
        top: -22%;
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      48.5% {
        top: 100%;
        opacity: 1;
      }
      50%, 100% {
        top: 100%;
        opacity: 0;
      }
    }

    @keyframes run-bottom {
      0%, 49% {
        right: -16%;
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      73.5% {
        right: 100%;
        opacity: 1;
      }
      75%, 100% {
        right: 100%;
        opacity: 0;
      }
    }

    @keyframes run-left {
      0%, 74% {
        bottom: -22%;
        opacity: 0;
      }
      75% {
        opacity: 1;
      }
      98.5% {
        bottom: 100%;
        opacity: 1;
      }
      100% {
        bottom: 100%;
        opacity: 0;
      }
    }

    @keyframes border-glow {
      0%, 100% {
        border-color: rgba(46, 163, 239, 0.78);
        box-shadow:
          inset 0 0 0 1px rgba(192, 232, 255, 0.24),
          inset 0 0 14px rgba(34, 158, 238, 0.22),
          inset 0 0 42px rgba(0, 54, 98, 0.24);
      }
      50% {
        border-color: rgba(126, 218, 255, 1);
        box-shadow:
          inset 0 0 0 1px rgba(225, 246, 255, 0.48),
          inset 0 0 25px rgba(46, 181, 255, 0.42),
          inset 0 0 62px rgba(0, 95, 175, 0.34);
      }
    }

    @keyframes rune-breathe {
      0%, 100% {
        opacity: 0.14;
        transform: scale(0.94) translateY(1.5%);
        filter:
          drop-shadow(0 0 3px rgba(84, 199, 255, 0.68))
          drop-shadow(0 0 10px rgba(23, 145, 234, 0.52))
          drop-shadow(0 0 22px rgba(0, 88, 180, 0.36));
      }
      50% {
        opacity: 0.29;
        transform: scale(1.035) translateY(-1.5%);
        filter:
          drop-shadow(0 0 6px rgba(151, 228, 255, 1))
          drop-shadow(0 0 18px rgba(36, 167, 255, 0.92))
          drop-shadow(0 0 36px rgba(0, 103, 205, 0.64));
      }
    }

    @keyframes emoji-float {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter:
          drop-shadow(0 0 3px rgba(212, 246, 255, 0.82))
          drop-shadow(0 0 7px rgba(49, 179, 255, 0.48));
      }
      50% {
        transform: translateY(-0.08em) scale(1.06);
        filter:
          drop-shadow(0 0 4px rgba(238, 252, 255, 1))
          drop-shadow(0 0 11px rgba(49, 179, 255, 0.76));
      }
    }

    @keyframes blue-drift {
      from {
        transform: translate3d(-1.5%, -1%, 0) scale(1.02);
      }
      to {
        transform: translate3d(1.5%, 1%, 0) scale(1.07);
      }
    }

    @media (max-height: 420px) {
      .banner {
        height: 100%;
      }
    }

    @media (max-aspect-ratio: 4 / 1) {
      .quote-cell {
        padding-inline: clamp(15px, 3vw, 46px);
      }

      .rune-mark {
        width: min(38%, 300px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .banner,
      .banner::before,
      .rune-mark,
      .perimeter-light,
      .message-emoji {
        animation: none !important;
      }

      .quote {
        transform: none !important;
        transition: opacity var(--transition-ms) linear;
      }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Jaxnir rotating message banner">
    <div class="rune-field" aria-hidden="true">
      <svg class="rune-mark" viewBox="0 0 180 180" focusable="false">
        <defs>
          <linearGradient id="runeGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d8f5ff"/>
            <stop offset="0.45" stop-color="#56c8ff"/>
            <stop offset="1" stop-color="#0878d0"/>
          </linearGradient>

          <symbol id="rune-algiz" viewBox="0 0 180 180">
            <path d="M90 158V26M90 82L38 30M90 82l52-52M90 112l-39 39M90 112l39 39"/>
          </symbol>

          <symbol id="rune-mjolnir" viewBox="0 0 180 180">
            <path d="M38 35h104v42l-23 18h-15v59H76V95H61L38 77z"/>
            <path d="M58 35v42M122 35v42M76 122h28"/>
          </symbol>

          <symbol id="rune-valknut" viewBox="0 0 180 180">
            <polygon points="90,20 151,127 29,127"/>
            <polygon points="55,68 145,68 100,148"/>
            <polygon points="125,68 80,148 35,68"/>
          </symbol>

          <symbol id="rune-tiwaz" viewBox="0 0 180 180">
            <path d="M90 158V26M90 26L45 72M90 26l45 46"/>
          </symbol>

          <symbol id="rune-othala" viewBox="0 0 180 180">
            <polygon points="90,25 145,88 90,142 35,88"/>
            <path d="M63 116L35 157M117 116l28 41"/>
          </symbol>

          <symbol id="rune-sowilo" viewBox="0 0 180 180">
            <path d="M126 20L55 74l69 31-70 55"/>
          </symbol>

          <symbol id="rune-fehu" viewBox="0 0 180 180">
            <path d="M63 158V22M63 52l62-30M63 88l62-30"/>
          </symbol>

          <symbol id="rune-raidho" viewBox="0 0 180 180">
            <path d="M54 158V22M54 24h42c34 0 40 49 4 62H54M86 86l47 72"/>
          </symbol>

          <symbol id="rune-eihwaz" viewBox="0 0 180 180">
            <path d="M90 20v140M90 45l39-25M90 73L51 98M90 107l39-25M90 135l-39 25"/>
          </symbol>

          <symbol id="rune-ansuz" viewBox="0 0 180 180">
            <path d="M55 158V22M55 48l70 43M55 84l70 43"/>

          </symbol>

          <symbol id="rune-ingwaz" viewBox="0 0 180 180">
            <polygon points="90,22 145,90 90,158 35,90"/>
          </symbol>
        </defs>
        <g class="rune-active">
          <use id="rune-use" href="#rune-algiz"></use>
        </g>
      </svg>
    </div>
    <div class="quote-cell">
      <p id="quote" class="quote" aria-live="polite"></p>
    </div>
    <div class="perimeter-light perimeter-top" aria-hidden="true"></div>
    <div class="perimeter-light perimeter-right" aria-hidden="true"></div>
    <div class="perimeter-light perimeter-bottom" aria-hidden="true"></div>
    <div class="perimeter-light perimeter-left" aria-hidden="true"></div>
  </main>

    const socialMessages = [

    const query = new URLSearchParams(window.location.search);
    const testMode = query.has("test");
    const DISPLAY_MS = testMode ? 900 : 9000;
    const TRANSITION_MS = testMode ? 120 : 600;
    const QUOTES_PER_CALLOUT = 2;

    const quoteElement = document.getElementById("quote");
    const quoteCell = document.querySelector(".quote-cell");
    const runeUse = document.getElementById("rune-use");
    const runeSymbols = [
      "rune-algiz",
      "rune-mjolnir",
      "rune-valknut",
      "rune-tiwaz",
      "rune-othala",
      "rune-sowilo",
      "rune-fehu",
      "rune-raidho",
      "rune-eihwaz",
      "rune-ansuz",
      "rune-berkana",
      "rune-ingwaz"
    ];
    let runeIndex = -1;

    function rotateRune() {
      runeIndex = (runeIndex + 1) % runeSymbols.length;
      runeUse.setAttribute("href", "#" + runeSymbols[runeIndex]);
    }


    const emojiRules = [
      { pattern: /\bclimb\b|\bmountain\b/i, emoji: "🏔️" },
      { pattern: /\bstorms?\b/i, emoji: "⛈️" },
      { pattern: /\bdarkest\b|\bnight\b/i, emoji: "🌙" },
      { pattern: /\bsunrise\b|\bdawn\b|\blight tomorrow\b/i, emoji: "🌅" },
      { pattern: /\bjourney\b|\bdirection\b|\bwherever\b|\bway out\b/i, emoji: "🧭" },
      { pattern: /\bstep\b|\bpace\b|\bforward\b|\bmoving\b|\bprogress\b/i, emoji: "🥾" },
      { pattern: /\bgrowth\b|\bgrow\b|\broots?\b/i, emoji: "🌱" },

      { pattern: /\bcourage\b|\bbold\b|\bfear\b|\bconflict\b|\bstrong\b|\bstrength\b|\bfight\b/i, emoji: "🛡️" },
      { pattern: /\btriumph\b|\bvictory\b|\bsuccess\b|\bbreakthrough\b|\bcomeback\b|\bwins?\b/i, emoji: "🏆" },
      { pattern: /\bbuild\b|\bwork\b|\beffort\b|\baction\b|\bdiscipline\b|\bhabits?\b|\bconsistency\b|\bresults?\b/i, emoji: "⚒️" },
      { pattern: /\bhope\b|\bdream\b|\bpotential\b|\bpossibility\b/i, emoji: "✨" },
      { pattern: /\bpatience\b|\buncertainty\b|\bprocess\b/i, emoji: "⏳" },
      { pattern: /\bbegin\b|\bstart\b|\breset\b|\banother chance\b|\bbegin again\b/i, emoji: "🔄" },
      { pattern: /\bfuture\b|\btomorrow\b/i, emoji: "🔮" },
      { pattern: /\bpressure\b|\bobstacle\b|\bhard days?\b|\bsetback\b|\bstruggle\b/i, emoji: "🔥" },
      { pattern: /\bshowing up\b|\bshow up\b|\bkeep going\b|\brefusing to quit\b|\bdo not quit\b/i, emoji: "⚔️" },
      { pattern: /\bPrime\b/i, emoji: "👑" },

      { pattern: /\bDISCORD\b/i, emoji: "💬" },
      { pattern: /\bfollow\b/i, emoji: "👣" },
      { pattern: /\bthank\b/i, emoji: "🙏" },
      { pattern: /\bsupport\b|\bcommunity\b/i, emoji: "🤝" }
    ];

    function emojiForMessage(message) {
      const match = emojiRules.find((rule) => rule.pattern.test(message));
      return match ? match.emoji : "✨";
    }

    function renderMessage(message) {
      rotateRune();
      quoteElement.textContent = "";

      const emoji = document.createElement("span");
      emoji.className = "message-emoji";
      emoji.setAttribute("aria-hidden", "true");
      emoji.textContent = emojiForMessage(message);

      const copy = document.createElement("span");
      copy.className = "message-copy";
      copy.textContent = message;

      quoteElement.append(emoji, copy);
    }


    let quoteDeck = [];
    let deckIndex = 0;
    let supportIndex = 0;
    let socialIndex = 0;
    let calloutTurn = 0;
    let quotesSinceCallout = 0;
    let currentMessage = "";
    let timerId = null;
    let resizeFrame = null;

    function shuffle(source) {
      const output = [...source];
      for (let i = output.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [output[i], output[j]] = [output[j], output[i]];
      }
      return output;
    }

    function refillDeck() {
      quoteDeck = shuffle(quotes);
      if (quoteDeck.length > 1 && quoteDeck[0] === currentMessage) {
        [quoteDeck[0], quoteDeck[1]] = [quoteDeck[1], quoteDeck[0]];
      }
      deckIndex = 0;
    }

    function nextQuote() {
      if (deckIndex >= quoteDeck.length) {
        refillDeck();
      }
      return quoteDeck[deckIndex++];
    }

    function nextMessage() {
      if (quotesSinceCallout >= QUOTES_PER_CALLOUT) {
        quotesSinceCallout = 0;
        const showSupport = calloutTurn % 2 === 0;
        calloutTurn += 1;

        if (showSupport) {
          const message = supportMessages[supportIndex % supportMessages.length];
          supportIndex += 1;
          return message;
        }

        const message = socialMessages[socialIndex % socialMessages.length];
        socialIndex += 1;
        return message;
      }
      quotesSinceCallout += 1;
      return nextQuote();
    }

    function clearTimer() {
      if (timerId !== null) {
        window.clearTimeout(timerId);
        timerId = null;
      }
    }

    function schedule(callback, delay) {
      clearTimer();
      timerId = window.setTimeout(callback, delay);
    }

    function fitText() {
      if (!quoteElement.textContent || quoteCell.clientWidth === 0 || quoteCell.clientHeight === 0) {
        return;
      }

      const minimum = 10;
      let low = minimum;
      let high = Math.max(minimum, Math.min(150, quoteCell.clientHeight * 0.62, quoteCell.clientWidth / 11));
      let best = minimum;

      for (let pass = 0; pass < 11; pass += 1) {
        const size = (low + high) / 2;
        quoteElement.style.fontSize = `${size}px`;
        quoteElement.style.letterSpacing = `${Math.max(0.55, size * 0.085)}px`;

        const lineHeight = size * 1.1;
        const lineCount = Math.ceil(quoteElement.scrollHeight / lineHeight - 0.02);
        const fits = quoteElement.scrollHeight <= quoteCell.clientHeight - 4
          && quoteElement.scrollWidth <= quoteCell.clientWidth
          && lineCount <= 2;

        if (fits) {
          best = size;
          low = size;
        } else {
          high = size;
        }
      }

      quoteElement.style.fontSize = `${best}px`;
      quoteElement.style.letterSpacing = `${Math.max(0.55, best * 0.075)}px`;
    }

    function requestFit() {
      if (resizeFrame !== null) {
        cancelAnimationFrame(resizeFrame);
      }
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = null;
        fitText();
      });
    }

    function settleEntry() {
      quoteElement.classList.remove("is-entering");
      schedule(beginExit, DISPLAY_MS);
    }

    function replaceMessage() {
      currentMessage = nextMessage();
      renderMessage(currentMessage);
      quoteElement.classList.remove("is-exiting");
      quoteElement.classList.add("is-entering");
      fitText();
      void quoteElement.offsetWidth;
      requestAnimationFrame(settleEntry);
    }

    function beginExit() {
      quoteElement.classList.add("is-exiting");
      schedule(replaceMessage, TRANSITION_MS);
    }

    function start() {
      clearTimer();
      refillDeck();
      currentMessage = nextMessage();
      renderMessage(currentMessage);
      quoteElement.classList.remove("is-exiting", "is-entering");
      fitText();
      schedule(beginExit, DISPLAY_MS);
    }

    const resizeObserver = new ResizeObserver(requestFit);
    resizeObserver.observe(quoteCell);

    document.addEventListener("visibilitychange", () => {
      clearTimer();
      quoteElement.classList.remove("is-exiting", "is-entering");
      if (!document.hidden) {
        fitText();
        schedule(beginExit, DISPLAY_MS);
      }
    });

    window.addEventListener("pagehide", clearTimer, { once: true });

    window.__jaxnirBanner = {
      quoteCount: quotes.length,
      runeCount: runeSymbols.length,
      supportMessageCount: supportMessages.length,
      socialMessageCount: socialMessages.length,
      quotesPerCallout: QUOTES_PER_CALLOUT,
      getCurrentMessage: () => currentMessage,
      getTimerActive: () => timerId !== null,
      fitText,
      next: beginExit
    };

    start();
  </script>
</body>
</html>
