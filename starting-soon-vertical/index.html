  <style>
    :root{--ice:#e8f8ff;--blue:#43b8ff;--steel:#98bfd4}

    .frame{position:absolute;z-index:9;inset:clamp(8px,1.5vw,22px);pointer-events:none;border:1px solid rgba(101,163,196,.58);box-shadow:inset 0 0 18px rgba(0,0,0,.82),0 0 12px rgba(16,126,202,.18);clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px))}.frame:before{content:"";position:absolute;inset:2px;border:2px solid rgba(30,161,244,.57);filter:drop-shadow(0 0 6px rgba(31,164,249,.62));animation:borderPulse 5s ease-in-out infinite}.scan{position:absolute;z-index:10;inset:clamp(10px,1.8vw,26px);pointer-events:none;filter:drop-shadow(0 0 8px #4abfff)}.scan rect{fill:none;stroke:#e2f9ff;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-dasharray:5 495;animation:borderTravel 12s linear infinite}.corner{position:absolute;z-index:10;width:7vw;height:7vw;min-width:26px;min-height:26px;border-color:#7ed4ff;filter:drop-shadow(0 0 5px rgba(68,186,255,.7));pointer-events:none}.tl{left:3vw;top:3vw;border-left:2px solid;border-top:2px solid}.tr{right:3vw;top:3vw;border-right:2px solid;border-top:2px solid}.bl{left:3vw;bottom:3vw;border-left:2px solid;border-bottom:2px solid}.br{right:3vw;bottom:3vw;border-right:2px solid;border-bottom:2px solid}
